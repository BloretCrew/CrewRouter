<!doctype html>
<html lang="zh-CN" data-blora-color-scheme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17161C">
  <title>CrewRouter Desktop</title>
  <link rel="stylesheet" href="vendor/blora-design/blora.css">
  <link rel="stylesheet" href="vendor/blora-design/tokens.dark.css">
  <link rel="stylesheet" href="vendor/blora-design/components/card/card.css">
  <link rel="stylesheet" href="vendor/blora-design/components/badge/badge.css">
  <link rel="stylesheet" href="vendor/blora-design/components/input/input.css">
  <link rel="stylesheet" href="vendor/blora-design/components/field/field.css">
  <link rel="stylesheet" href="vendor/blora-design/components/button/button.css">
  <link rel="stylesheet" href="vendor/blora-design/components/hero/hero.css">
  <link rel="stylesheet" href="vendor/blora-design/components/steps/steps.css">
  <link rel="stylesheet" href="vendor/blora-design/components/result/result.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="blora-page blora-scope">
  <noscript><p class="blora-fallback-message">CrewRouter Desktop 需要启用 JavaScript。</p></noscript>
  <main class="oobe-shell" aria-labelledby="page-title">
    <header class="oobe-header">
      <button id="settings" class="blora-button" data-variant="ghost" data-size="sm" type="button">
        <span class="button-icon" data-icon="settings" aria-hidden="true"></span><span>设置</span>
      </button>
      <a class="blora-brand" href="#page-title" aria-label="CrewRouter Desktop 首页">
        <span class="blora-brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span><strong>CrewRouter</strong><small>DESKTOP</small></span>
      </a>
      <span class="blora-badge" data-variant="soft">安全连接</span>
    </header>

    <section class="blora-hero oobe-hero" data-size="compact" aria-describedby="intro">
      <div class="blora-hero__content">
        <p class="blora-eyebrow">首次启动</p>
        <h1 id="page-title">开始使用 CrewRouter</h1>
        <p id="intro">选择本地使用，或连接已有服务器。</p>
      </div>
    </section>

    <nav class="oobe-progress" aria-label="设置进度">
      <blora-steps id="oobe-steps" current="0">
        <blora-step title="选择方式" description="选择本地或远程连接"></blora-step>
        <blora-step title="完成设置" description="填写必要信息"></blora-step>
        <blora-step title="开始使用" description="进入 CrewRouter"></blora-step>
      </blora-steps>
    </nav>

    <section id="welcome-panel" class="oobe-panel" aria-labelledby="welcome-heading">
      <div class="oobe-panel__heading">
        <div><p class="blora-eyebrow">第一步</p><h2 id="welcome-heading">选择一种方式</h2></div>
      </div>
      <p class="oobe-description">本地使用无需登录；连接服务器时，登录由目标服务器负责。</p>
      <div class="oobe-choice-grid">
        <button id="local" class="blora-card oobe-choice" data-variant="hover" type="button">
          <span class="oobe-choice__icon" data-icon="home" aria-hidden="true"></span>
          <span class="oobe-choice__copy"><strong>本地使用</strong><small>启动本地服务，无需登录</small></span>
          <span class="oobe-choice__arrow" data-icon="chevron-right" aria-hidden="true"></span>
        </button>
        <button id="remote-choice" class="blora-card oobe-choice" data-variant="hover" type="button">
          <span class="oobe-choice__icon" data-icon="globe" aria-hidden="true"></span>
          <span class="oobe-choice__copy"><strong>连接服务器</strong><small>连接官方站或自定义服务器</small></span>
          <span class="oobe-choice__arrow" data-icon="chevron-right" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <section id="local-profile-panel" class="oobe-panel blora-card" data-variant="content" aria-labelledby="local-profile-heading" hidden>
      <div class="oobe-panel__heading"><div><p class="blora-eyebrow">第二步</p><h2 id="local-profile-heading">设置你的用户名</h2></div><button id="local-back" class="blora-button" data-variant="text" data-size="sm" type="button"><span class="button-icon" data-icon="chevron-left" aria-hidden="true"></span>返回</button></div>
      <p class="oobe-description">只需设置一次，用于显示在本地控制台和资料中。</p>
      <form id="local-profile-form" class="oobe-form" novalidate>
        <blora-field id="local-username-field" label="用户名" name="local-username" hint="可使用普通文字、数字或短横线，最多 64 个字符。" maxlength="64" autocomplete="nickname" required></blora-field>
        <p id="local-username-error" class="oobe-field-error" role="alert"></p>
        <div class="oobe-actions"><button id="local-continue" class="blora-button" data-variant="primary" data-size="lg" type="submit">继续进入本地控制台 <span class="button-icon" data-icon="arrow-right" aria-hidden="true"></span></button></div>
      </form>
    </section>

    <section id="remote-method-panel" class="oobe-panel blora-card" data-variant="content" aria-labelledby="remote-method-heading" hidden>
      <div class="oobe-panel__heading"><div><p class="blora-eyebrow">第二步</p><h2 id="remote-method-heading">连接服务器</h2></div><button id="choice-back" class="blora-button" data-variant="text" data-size="sm" type="button"><span class="button-icon" data-icon="chevron-left" aria-hidden="true"></span>返回</button></div>
      <p class="oobe-description">选择连接方式。Personal / Team 由目标服务器自动识别。</p>
      <div class="oobe-choice-list">
        <button id="official-remote" class="blora-card oobe-choice" data-variant="hover" type="button"><span class="oobe-choice__icon" data-icon="external-link" aria-hidden="true"></span><span class="oobe-choice__copy"><strong>通过官方站连接</strong><small>验证目标服务器后，打开官方站转向入口</small></span><span class="oobe-choice__arrow" data-icon="chevron-right" aria-hidden="true"></span></button>
        <button id="custom-remote" class="blora-card oobe-choice" data-variant="hover" type="button"><span class="oobe-choice__icon" data-icon="search" aria-hidden="true"></span><span class="oobe-choice__copy"><strong>输入服务器地址</strong><small>直接打开你填写的服务器，不经过官方站</small></span><span class="oobe-choice__arrow" data-icon="chevron-right" aria-hidden="true"></span></button>
      </div>
    </section>

    <section id="official-target-panel" class="oobe-panel blora-card" data-variant="content" aria-labelledby="official-target-heading" hidden>
      <div class="oobe-panel__heading"><div><p class="blora-eyebrow">第三步</p><h2 id="official-target-heading">输入目标服务器</h2></div><button id="official-back" class="blora-button" data-variant="text" data-size="sm" type="button"><span class="button-icon" data-icon="chevron-left" aria-hidden="true"></span>返回</button></div>
      <p class="oobe-description">Desktop 只验证公开实例信息，不接触登录凭据。</p>
      <form id="official-remote-form" class="oobe-form" novalidate>
        <blora-field id="official-url-field" label="目标服务器地址" name="official-url" type="url" placeholder="https://server.example.com" hint="验证通过后将在系统浏览器打开官方站转向入口。" autocomplete="url" inputmode="url" required></blora-field>
        <p id="official-url-error" class="oobe-field-error" role="alert"></p>
        <div class="oobe-actions"><button id="official-continue" class="blora-button" data-variant="primary" data-size="lg" type="submit">打开官方站 <span class="button-icon" data-icon="external-link" aria-hidden="true"></span></button></div>
      </form>
    </section>

    <section id="custom-target-panel" class="oobe-panel blora-card" data-variant="content" aria-labelledby="custom-target-heading" hidden>
      <div class="oobe-panel__heading"><div><p class="blora-eyebrow">第三步</p><h2 id="custom-target-heading">输入服务器地址</h2></div><button id="custom-back" class="blora-button" data-variant="text" data-size="sm" type="button"><span class="button-icon" data-icon="chevron-left" aria-hidden="true"></span>返回</button></div>
      <p class="oobe-description">登录由目标服务器负责，Desktop 不保存凭据。</p>
      <form id="connection-form" class="oobe-form" novalidate>
        <blora-field id="custom-url-field" label="服务器地址" name="remote-url" type="url" placeholder="https://server.example.com" hint="仅支持 http:// 或 https:// 地址。" autocomplete="url" inputmode="url" required></blora-field>
        <p id="url-error" class="oobe-field-error" role="alert"></p>
        <div class="oobe-actions"><button id="remote" class="blora-button" data-variant="primary" data-size="lg" type="submit">直接连接服务器 <span class="button-icon" data-icon="external-link" aria-hidden="true"></span></button></div>
      </form>
    </section>

    <section id="status-panel" class="oobe-status" aria-live="polite" aria-atomic="true" hidden>
      <blora-result id="status-result" variant="info" title="正在处理" description=""></blora-result>
      <p id="runtime-error" class="oobe-field-error" role="alert"></p>
      <p id="status" class="oobe-status__text" role="status"></p>
    </section>

    <footer class="oobe-footer"><small>远程页面负责登录；Desktop 不接管凭据。</small><button id="quit" class="blora-button" data-variant="text" data-size="sm" type="button">退出应用 <kbd>⌘Q</kbd></button></footer>
  </main>
  <script type="module" src="vendor/blora-design/auto.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
