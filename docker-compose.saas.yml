# CrewRouter SaaS 模式部署
#
# 用于你自己的服务器，托管给用户使用
# 通过用户注册/计费系统控制

services:
  crewrouter:
    image: crewrouter/crewrouter-saas:latest
    container_name: crewrouter-saas
    restart: unless-stopped
    ports:
      - "${CR_APP_PORT:-20003}:20003"
    environment:
      CR_APP_PORT: "20003"
      CR_APP_HOST: "${CR_APP_HOST:-localhost}"
      CR_SESSION_SECRET: "${CR_SESSION_SECRET}"
      CR_DB_HOST: postgres
      CR_DB_PORT: "5432"
      CR_DB_NAME: "${CR_DB_NAME:-crewrouter}"
      CR_DB_USER: "${CR_DB_USER:-crewrouter}"
      CR_DB_PASSWORD: "${CR_DB_PASSWORD}"
      CR_EMAIL_ADDRESS: "${CR_EMAIL_ADDRESS:-}"
      CR_EMAIL_PASSWORD: "${CR_EMAIL_PASSWORD:-}"
      CR_SMTP_HOST: "${CR_SMTP_HOST:-}"
      CR_SMTP_PORT: "${CR_SMTP_PORT:-465}"
      CR_SMTP_SSL: "${CR_SMTP_SSL:-true}"
      CR_FEISHU_APP_ID: "${CR_FEISHU_APP_ID:-}"
      CR_FEISHU_APP_SECRET: "${CR_FEISHU_APP_SECRET:-}"
      CR_FEISHU_TENANT_KEY: "${CR_FEISHU_TENANT_KEY:-}"
      CR_GITHUB_CLIENT_ID: "${CR_GITHUB_CLIENT_ID:-}"
      CR_GITHUB_CLIENT_SECRET: "${CR_GITHUB_CLIENT_SECRET:-}"
      CR_GITHUB_REDIRECT_URI: "${CR_GITHUB_REDIRECT_URI:-}"
    volumes:
      - crewrouter-saas-logs:/app/log
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crewrouter-net

  postgres:
    image: postgres:16-alpine
    container_name: crewrouter-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${CR_DB_NAME:-crewrouter}"
      POSTGRES_USER: "${CR_DB_USER:-crewrouter}"
      POSTGRES_PASSWORD: "${CR_DB_PASSWORD}"
    volumes:
      - crewrouter-saas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CR_DB_USER:-crewrouter}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crewrouter-net

  # 可选：Nginx 反向代理（如需 SSL 终止）
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - crewrouter
  #   networks:
  #     - crewrouter-net

volumes:
  crewrouter-saas-data:
    driver: local
  crewrouter-saas-logs:
    driver: local

networks:
  crewrouter-net:
    driver: bridge
