<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="设置密码 - CrewRouter">设置密码 - CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/blora/blora.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/main.css">
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>
  <script type="module" src="/blora/auto.js"></script>
</head>
<body class="blora-page blora-scope">
<div style="position:absolute;top:10px;right:12px;z-index:99;"><blora-select id="langToggle" class="blora-button" data-size="icon" data-variant="secondary" title="Language" style="width:auto;height:28px;padding:0 6px;font-size:12px;cursor:pointer;">
      <blora-option value="zh">中文</blora-option>
      <blora-option value="en">EN</blora-option>
    </blora-select></div>
  <div class="login-container">
    <div class="login-bg">
      <div class="grid"></div>
    </div>

    <div class="login-card">
      <div class="logo">
        <div style="display:flex;align-items:center;justify-content:center;gap:12px;">
          <img src="https://img.bloret.net/img/1778334791692/7cf47c179900187457dc3abba0eaf918" alt="Logo" style="width:40px;height:40px;border-radius:10px;">
          <h1>CrewRouter</h1>
        </div>
        <p><span data-i18n="设置登录密码">设置登录密码</span></p>
      </div>

      <div class="login-form">
        <div id="errorMessage" class="error-message"></div>

        <div style="text-align:center;padding:8px 0 16px;">
          <div style="width:64px;height:64px;background:var(--brand-blue,#3370ff);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <p style="font-size:14px;color:var(--text-secondary,#6b7280);margin:0;"><span data-i18n="你好，">
            你好，</span><strong id="usernameLabel">-</strong>
          </p>
          <p style="font-size:13px;color:var(--text-secondary,#6b7280);margin:8px 0 0;line-height:1.5;"><span data-i18n="您通过飞书登录注册，账号尚未设置密码。">
            您通过飞书登录注册，账号尚未设置密码。</span><br><span data-i18n="请设置密码以便使用密码登录及安全相关功能。">
            请设置密码以便使用密码登录及安全相关功能。
          </span></p>
        </div>

        <form id="setPasswordForm" onsubmit="handleSetPassword(event)">
          <div class="form-group">
            <input type="password" id="password" placeholder="新密码（至少6位）" data-i18n-placeholder="新密码（至少6位）" class="blora-input" minlength="6" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <input type="password" id="confirmPassword" placeholder="确认新密码" data-i18n-placeholder="确认新密码" class="blora-input" minlength="6" autocomplete="new-password" required>
          </div>
          <button type="submit" class="blora-button login-btn" id="submitBtn">
            <span id="submitText"><span data-i18n="设置密码并继续">设置密码并继续</span></span>
          </button>
        </form>
      </div>

      <div class="login-footer">
        <p><span data-i18n="设置完成后可正常使用控制台">设置完成后可正常使用控制台</span></p>
      </div>
    </div>
  </div>

  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/theme.js?v=2"></script>
  <script>
    async function init() {
      try {
        const res = await fetch('/auth/me', { credentials: 'same-origin' });
        if (!res.ok) {
          window.location.replace('/');
          return;
        }
        const user = await res.json();
        document.getElementById('usernameLabel').textContent = user.username || user.email || '用户';
        // 已有密码则无需停留
        if (!user.needsPasswordSetup) {
          window.location.replace('/console');
        }
      } catch (e) {
        window.location.replace('/');
      }
    }

    async function handleSetPassword(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('submitText');
      const errorEl = document.getElementById('errorMessage');

      errorEl.classList.remove('show');

      if (!password || password.length < 6) {
        errorEl.textContent = '密码长度至少 6 位';
        errorEl.classList.add('show');
        return;
      }
      if (password !== confirmPassword) {
        errorEl.textContent = '两次输入的密码不一致';
        errorEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btnText.innerHTML = `<span class="inline-loading"><div class="loading-spinner sm" role="status" aria-label="加载中"></div><span class="inline-loading-text">提交中…</span></span>`;

      try {
        const res = await fetch('/auth/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ password, confirmPassword }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/console';
          return;
        }
        errorEl.textContent = data.error || '设置失败';
        errorEl.classList.add('show');
      } catch (err) {
        errorEl.textContent = '网络错误，请稍后重试';
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btnText.textContent = '设置密码并继续';
      }
    }

    init();
  </script>
<script>
  // Page-level i18n: apply catalog to static DOM once ready.
  (function () {
    function apply() { if (window.I18N) I18N.applyDom(); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', apply);
    } else { apply(); }
    document.addEventListener('i18n:ready', apply);
    var el = document.getElementById('langToggle');
    if (el && window.I18N) {
      el.value = I18N.current();
      el.addEventListener('change', function () { I18N.load(el.value); });
    }
  })();
</script>
</body>
</html>
