<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var mode = localStorage.getItem('theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', !dark);
      document.documentElement.setAttribute('data-blora-color-scheme', dark ? 'dark' : 'light');
    }());
  </script>

  <title data-i18n="设置密码 - CrewRouter">设置密码 - CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script type="module" src="/blora/auto.js?v=2.0.8"></script>
  <link rel="stylesheet" href="/blora/blora.css?v=2.0.8">
  <link rel="stylesheet" href="/blora/tokens.dark.css?v=2.0.8">
  <script src="/js/blora-foundation.js?v=2.0.8"></script>
  <link rel="stylesheet" href="/css/auth-shell.css?v=5">
  <link rel="stylesheet" href="/css/edition-badge.css?v=1">
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>
</head>
<body class="blora-page">
  <main class="auth-page login-container">
    <section class="blora-card auth-card login-card" aria-labelledby="auth-title">
      <header class="auth-card__header">
        <span class="auth-card__logo" aria-hidden="true"><img src="https://img.bloret.net/img/1778334791692/7cf47c179900187457dc3abba0eaf918" alt=""></span>
        <h1 id="auth-title">CrewRouter <span class="brand-edition-badge" data-edition-badge hidden></span></h1>
        <p><span data-i18n="设置登录密码">设置登录密码</span></p>
      </header>

      <div id="errorMessage" class="blora-message auth-error" data-variant="danger" role="alert"></div>

      <div class="auth-intro">
        <span class="auth-intro__icon" aria-hidden="true"><img src="https://img.bloret.net/SF/lock.fill?color=white" alt="" width="24" height="24" class="sf-icon" data-sf-name="lock.fill"></span>
        <p class="auth-intro__title"><span data-i18n="你好，">你好，</span><strong id="usernameLabel">-</strong></p>
        <p class="auth-intro__desc"><span data-i18n="您通过飞书登录注册，账号尚未设置密码。">您通过飞书登录注册，账号尚未设置密码。</span><br><span data-i18n="请设置密码以便使用密码登录及安全相关功能。">请设置密码以便使用密码登录及安全相关功能。</span></p>
      </div>

      <form id="setPasswordForm" onsubmit="handleSetPassword(event)">
        <blora-field id="password" label="新密码" name="password" type="password" placeholder="新密码（至少6位）" minlength="6" autocomplete="new-password" required></blora-field>
        <blora-field id="confirmPassword" label="确认新密码" name="confirmPassword" type="password" placeholder="确认新密码" minlength="6" autocomplete="new-password" required></blora-field>
        <div class="auth-actions">
          <button type="submit" class="blora-button" data-variant="primary" id="submitBtn"><span id="submitText"><span data-i18n="设置密码并继续">设置密码并继续</span></span></button>
        </div>
      </form>

      <p class="auth-simple-link"><span data-i18n="设置完成后可正常使用控制台">设置完成后可正常使用控制台</span></p>

      <footer class="auth-card__footer">
        <blora-dropdown id="langToggle" class="auth-lang" align="center" placement="top" aria-label="选择语言"><button slot="trigger" type="button" class="blora-button" data-variant="ghost" data-size="sm"><img class="sf-icon" src="https://img.bloret.net/SF/globe?color=white" alt="" width="16" height="16" data-sf-name="globe"><span id="langToggleLabel">中文</span></button><blora-dropdown-item value="zh" href="/set-password?lang=zh">中文</blora-dropdown-item><blora-dropdown-item value="en" href="/set-password?lang=en">EN</blora-dropdown-item></blora-dropdown>
        <button id="themeToggle" class="blora-button" data-variant="ghost" data-size="sm" type="button" title="切换主题" data-i18n-title="切换主题" aria-label="切换主题"><img class="icon-sun sf-icon" src="https://img.bloret.net/SF/sun.max?color=white" alt="" width="18" height="18" data-sf-name="sun.max"><img class="icon-moon sf-icon" src="https://img.bloret.net/SF/moon?color=white" alt="" width="18" height="18" data-sf-name="moon" style="display:none"><img class="icon-system sf-icon" src="https://img.bloret.net/SF/desktopcomputer?color=white" alt="" width="18" height="18" data-sf-name="desktopcomputer" style="display:none"></button>
      </footer>
    </section>
  </main>

  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/edition-badge.js?v=1"></script>
  <script>
    async function init() {
      try {
        const res = await fetch('/auth/me', { credentials: 'same-origin' });
        if (!res.ok) {
          window.location.replace('/');
          return;
        }
        const user = await res.json();
        document.getElementById('usernameLabel').textContent = user.username || user.email || '用户';
        // 已有密码则无需停留
        if (!user.needsPasswordSetup) {
          window.location.replace('/console');
        }
      } catch (e) {
        window.location.replace('/');
      }
    }

    async function handleSetPassword(e) {
      e.preventDefault();
      const password = document.querySelector('#password input')?.value || '';
      const confirmPassword = document.querySelector('#confirmPassword input')?.value || '';
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('submitText');
      const errorEl = document.getElementById('errorMessage');

      errorEl.classList.remove('show');
      document.getElementById('confirmPassword').removeAttribute('state');

      if (!password || password.length < 6) {
        errorEl.textContent = '密码长度至少 6 位';
        errorEl.classList.add('show');
        return;
      }
      if (password !== confirmPassword) {
        errorEl.textContent = '两次输入的密码不一致';
        errorEl.classList.add('show');
        document.getElementById('confirmPassword').setAttribute('state', 'invalid');
        return;
      }

      btn.disabled = true;
      btnText.innerHTML = `<span class="auth-inline-loading"><span class="blora-spinner" data-size="sm" role="status" aria-label="加载中"></span><span>提交中…</span></span>`;

      try {
        const res = await fetch('/auth/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ password, confirmPassword }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/console';
          return;
        }
        errorEl.textContent = data.error || '设置失败';
        errorEl.classList.add('show');
      } catch (err) {
        errorEl.textContent = '网络错误，请稍后重试';
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btnText.textContent = '设置密码并继续';
      }
    }

    init();
  </script>
<script>
  // Page-level i18n: apply catalog to static DOM once ready.
  (function () {
    function apply() { if (window.I18N) I18N.applyDom(); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', apply);
    } else { apply(); }
    document.addEventListener('i18n:ready', apply);
    var label = document.getElementById('langToggleLabel');
    if (label && window.I18N && typeof I18N.current === 'function') {
      label.textContent = I18N.current() === 'en' ? 'EN' : '中文';
    }
  })();
</script>
</body>
</html>
