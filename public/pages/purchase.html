<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var mode = localStorage.getItem('theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', !dark);
      document.documentElement.setAttribute('data-blora-color-scheme', dark ? 'dark' : 'light');
    }());
  </script>

  <title data-i18n="购买商品 - CrewRouter">购买商品 - CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script type="module" src="/blora/auto.js?v=2.1.0"></script>
  <script src="/js/blora-foundation.js?v=restore-0930-20261003"></script>
  <link rel="stylesheet" href="/css/layers.css?v=2.1.0">
  <link rel="stylesheet" href="/css/themes.css?v=restore-0930-20261003">
  <link rel="stylesheet" href="/css/main.css?v=restore-0930-20261003">
  <link rel="stylesheet" href="/css/edition-badge.css?v=restore-0930-20261003">
  <link rel="stylesheet" href="/css/purchase-blora.css?v=purchase-blora-surfaces-20261010">
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>
  <style>
    .purchase-container {
      max-width: 480px;
      margin: 60px auto;
      padding: 0 20px;
    }
    .purchase-card { overflow:hidden; min-width:0; }
    .purchase-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: var(--muted);
    }
    .purchase-image-placeholder {
      width: 100%;
      height: 240px;
      background: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-foreground);
      font-size: 48px;
    }
    .purchase-info { padding: var(--blora-space-5); }
    .purchase-name { color:var(--blora-color-text-primary); font:700 var(--blora-text-xl) var(--blora-font-heading); margin-bottom: var(--blora-space-2); overflow-wrap:anywhere; }
    .purchase-desc { color:var(--blora-color-text-muted); margin-bottom:var(--blora-space-5); line-height:1.6; overflow-wrap:anywhere; }
    .purchase-error { display:flex; min-height:9rem; align-items:center; justify-content:center; padding:var(--blora-space-5); text-align:center; }
    .purchase-status[data-variant="info"] { border:var(--blora-border-subtle); background:var(--blora-color-surface-raised); color:var(--blora-color-text-secondary); }
    .purchase-status[data-variant="danger"] { border:1px solid color-mix(in srgb,var(--blora-color-status-danger) 30%,var(--blora-color-border-subtle)); background:color-mix(in srgb,var(--blora-color-status-danger) 10%,var(--blora-color-surface-default)); color:var(--blora-color-status-danger); }
    .purchase-btn { width:100%; min-height:2.75rem; }
    .purchase-btn:hover { opacity:.92; }
    .purchase-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--muted-foreground);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--foreground);
    }
    .purchase-status {
      margin-top: var(--blora-space-4);
      padding: var(--blora-space-3);
      border: var(--blora-border-subtle);
      border-radius: var(--blora-radius-md);
      font-size: var(--blora-text-sm);
      text-align: center;
    }
    .loading-text {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted-foreground);
    }
    .error-text {
      text-align: center;
      padding: 60px 20px;
      color: var(--destructive);
    }
  </style>
  <link rel="stylesheet" href="/blora/blora.css?v=2.1.0">
  <link rel="stylesheet" href="/blora/tokens.dark.css?v=2.1.0">
</head>
<body class="blora-page blora-scope purchase-page">
<div style="position:absolute;top:10px;right:12px;z-index:99;"><blora-select id="langToggle" title="Language" aria-label="Language">
      <blora-option value="zh">中文</blora-option>
      <blora-option value="en">EN</blora-option>
    </blora-select></div>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <img src="https://img.bloret.net/img/1778334791692/7cf47c179900187457dc3abba0eaf918" alt="Logo" style="width:28px;height:28px;border-radius:6px;">
          <h2>CrewRouter <span class="brand-edition-badge" data-edition-badge hidden></span></h2>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-item" onclick="window.location.href='/console'">
            <img src="https://img.bloret.net/SF/arrow.backward?color=white" alt="" width="16" height="16" class="sf-icon" data-sf-name="arrow.backward">
            <span><span data-i18n="返回控制台">返回控制台</span></span>
          </div>
        </div>
      </nav>
    </aside>

    <main class="main-content">
      <div class="content-header">
        <h1><span data-i18n="购买商品">购买商品</span></h1>
      </div>

      <div class="purchase-container" id="purchaseContent">
        <div class="page-loading"><div class="loading-spinner" role="status" aria-label="加载中" data-i18n-title="加载中"></div><div class="page-loading-text"><span data-i18n="加载中...">加载中...</span></div></div>
      </div>
    </main>
  </div>

  <script src="/js/i18n.js?v=blora-select-change-20261009"></script>
  <script src="/js/theme.js?v=blora-color-scheme-20261009"></script>
  <script src="/js/edition-badge.js?v=restore-0930-20261003"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');

    async function loadProduct() {
      const container = document.getElementById('purchaseContent');

      if (!productId) {
        container.innerHTML = '<div class="purchase-error"><blora-empty title="商品ID不存在"></blora-empty></div>';
        return;
      }

      try {
        const res = await fetch('/api/user/products');
        if (!res.ok) throw new Error('加载失败');
        const products = await res.json();
        const product = products.find(p => p.id === parseInt(productId));

        if (!product) {
          container.innerHTML = '<div class="purchase-error"><blora-empty title="商品不存在或已下架"></blora-empty></div>';
          return;
        }

        container.innerHTML = `
          <a href="/console" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回余额
          </a>
          <div class="blora-card purchase-card" data-variant="content">
            ${product.image_url
              ? `<img class="purchase-image" src="${product.image_url}" alt="${product.name}">`
              : `<div class="purchase-image-placeholder">📦</div>`
            }
            <div class="purchase-info">
              <div class="purchase-name">${product.name}</div>
              ${product.description ? `<div class="purchase-desc">${product.description}</div>` : ''}
              <button type="button" class="purchase-btn blora-button" data-variant="primary" onclick="handlePurchase()">立即购买</button>
              <div id="purchaseStatus" class="purchase-status" style="display:none;"></div>
            </div>
          </div>
        `;
      } catch (error) {
        container.innerHTML = '<div class="purchase-error"><blora-empty title="加载商品信息失败"></blora-empty></div>';
      }
    }

    function handlePurchase() {
      const statusEl = document.getElementById('purchaseStatus');
      statusEl.style.display = 'block';
      statusEl.dataset.variant = 'info';
      statusEl.textContent = '购买功能暂未开放，敬请期待';
    }

    loadProduct();
  </script>
<script>
  // Page-level i18n: apply catalog to static DOM once ready.
  (function () {
    function apply() { if (window.I18N) I18N.applyDom(); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', apply);
    } else { apply(); }
    document.addEventListener('i18n:ready', apply);
  })();
</script>
</body>
</html>
