<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/css/layers.css?v=2.1.0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var mode = localStorage.getItem('theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', !dark);
      document.documentElement.setAttribute('data-blora-color-scheme', dark ? 'dark' : 'light');
    }());
  </script>

  <title data-i18n="购买商品 - CrewRouter">购买商品 - CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/blora/icons-full.global.js?v=2.1.0"></script>
  <script type="module" src="/blora/auto.js?v=2.1.0"></script>
  <script src="/js/blora-foundation.js"></script>
  <style>@import url("/css/edition-badge.css?v=2") layer(legacy);</style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>
  <style>.purchase-container { max-width: 480px; margin: 60px auto; padding: 0 20px; }
.purchase-card { overflow: hidden; }
.purchase-image { width: 100%; height: 240px; object-fit: cover; }
.purchase-image-placeholder { width: 100%; height: 240px; display: flex; align-items: center; justify-content: center; }
.purchase-info { padding: 24px; }
.purchase-name { margin-bottom: 8px; }
.purchase-desc { margin-bottom: 20px; }
.purchase-btn { width: 100%; }
.back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; }
.purchase-status { margin-top: 16px; padding: 12px; text-align: center; }
.loading-text { text-align: center; padding: 60px 20px; }
.error-text { text-align: center; padding: 60px 20px; }
</style>
  <link rel="stylesheet" href="/blora/blora.css?v=2.1.0">
  <link rel="stylesheet" href="/blora/tokens.dark.css?v=2.1.0">
  <script type="module" src="/js/blora-services.js?v=2.1.0"></script>
</head>
<body class="blora-page blora-scope">
<div style="position:absolute;top:10px;right:12px;z-index:99;"><blora-select id="langToggle" aria-label="Language">
      <blora-option value="zh">中文</blora-option>
      <blora-option value="en">EN</blora-option>
    </blora-select></div>
  <main class="blora-container blora-container--prose blora-stack blora-stack--lg" style="padding-block:var(--blora-space-8)">
    <header class="blora-stack"><a href="/console" class="blora-button" data-variant="ghost" data-icon="arrow-left">返回控制台</a><div class="blora-row"><h1 class="blora-h2" data-i18n="购买商品">购买商品</h1><span class="brand-edition-badge" data-edition-badge hidden></span></div></header>
    <div id="purchaseContent" class="blora-stack"><div class="blora-skeleton" data-variant="text" aria-label="加载中"></div></div>
  </main>
  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/theme.js?v=correction-2"></script>
  <script src="/js/edition-badge.js?v=1"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');

    function escapeProduct(value) { return String(value || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    async function loadProduct() {
      const container = document.getElementById('purchaseContent');

      if (!productId) {
        container.innerHTML = '<blora-alert variant="danger" title="商品ID不存在"></blora-alert>';
        return;
      }

      try {
        const res = await fetch('/api/user/products');
        if (!res.ok) throw new Error('加载失败');
        const products = await res.json();
        const product = products.find(p => p.id === parseInt(productId));

        if (!product) {
          container.innerHTML = '<blora-alert variant="danger" title="商品不存在或已下架"></blora-alert>';
          return;
        }

        container.innerHTML = `
          <a href="/console" class="back-link">
            <span data-icon="check" aria-hidden="true"></span>
            返回余额
          </a>
          <div class="purchase-card blora-card" data-size="sm">
            ${product.image_url
              ? `<img class="purchase-image" src="${escapeProduct(product.image_url)}" alt="${escapeProduct(product.name)}">`
              : `<div class="purchase-image-placeholder"><span data-icon="package" aria-hidden="true"></span></div>`
            }
            <div class="purchase-info blora-stack">
              <h2 class="blora-card__title">${escapeProduct(product.name)}</h2>
              ${product.description ? `<div class="purchase-desc blora-card__desc">${escapeProduct(product.description)}</div>` : ''}
              <button class="purchase-btn blora-button" id="purchaseAction" data-variant="primary" type="button">立即购买</button>
              <div id="purchaseStatus" class="purchase-status" style="display:none;"></div>
            </div>
          </div>
        `;
        document.getElementById('purchaseAction').addEventListener('click', handlePurchase);
      } catch (error) {
        container.innerHTML = '<blora-alert variant="danger" title="加载商品信息失败"></blora-alert><button type="button" class="blora-button" data-variant="outline" id="purchaseRetry">重试</button>';
        document.getElementById('purchaseRetry').addEventListener('click', loadProduct);
      }
    }

    function handlePurchase() {
      const statusEl = document.getElementById('purchaseStatus');
      statusEl.style.display = 'block';
      statusEl.innerHTML = '<blora-alert variant="info" title="购买功能暂未开放，敬请期待"></blora-alert>';
    }

    loadProduct();
  </script>
<script>
  // Page-level i18n: apply catalog to static DOM once ready.
  (function () {
    function apply() { if (window.I18N) I18N.applyDom(); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', apply);
    } else { apply(); }
    document.addEventListener('i18n:ready', apply);
    var el = document.getElementById('langToggle');
    if (el && window.I18N) {
      el.value = I18N.current();
      el.addEventListener('change', function () { I18N.load(el.value); });
    }
  })();
</script>
</body>
</html>
