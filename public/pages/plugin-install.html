<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var mode = localStorage.getItem('theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', !dark);
      document.documentElement.setAttribute('data-blora-color-scheme', dark ? 'dark' : 'light');
    }());
  </script>

  <title>安装插件到 CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script type="module" src="/blora/auto.js?v=2.0.8"></script>
  <script src="/js/blora-foundation.js"></script>
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/edition-badge.css?v=1">
  <style>
    .pi-wrap { max-width: 640px; margin: 0 auto; padding: var(--blora-space-10) var(--blora-space-4); }
    .pi-brand { margin-bottom: var(--blora-space-3); font: var(--blora-text-lg) var(--blora-font-heading); color: var(--blora-color-text-primary); }
    .pi-card { padding: var(--blora-space-6); }
    .pi-title { margin: 0 0 var(--blora-space-1); font: var(--blora-text-xl) var(--blora-font-heading); }
    .pi-byline { margin-bottom: var(--blora-space-4); color: var(--blora-color-text-subtle); font-size: var(--blora-text-sm); }
    .pi-section { margin: var(--blora-space-5) 0; }
    .pi-section h3 { margin: 0 0 var(--blora-space-2); color: var(--blora-color-text-subtle); font-size: var(--blora-text-sm); }
    .pi-section ul { margin: 0; padding-left: var(--blora-space-5); line-height: 1.7; }
    .pi-section ul li code { background: var(--blora-color-surface-raised); padding: 1px var(--blora-space-1); border-radius: var(--blora-radius-sm); font-size: var(--blora-text-xs); }
    .pi-desc { color: var(--blora-color-text-emphasis); line-height: 1.7; }
    .pi-warn { margin-top: var(--blora-space-4); }
    .pi-actions { display: flex; gap: var(--blora-space-2); margin-top: var(--blora-space-5); flex-wrap: wrap; }
    .pi-link { color: var(--blora-color-action-primary); }
    .pi-loading, .pi-err { text-align: center; padding: var(--blora-space-10) 0; color: var(--blora-color-text-subtle); }
    .pi-err strong { display: block; margin-bottom: var(--blora-space-2); color: var(--blora-color-status-danger); }
  </style>
  <script src="/js/edition-badge.js?v=1"></script>
  <link rel="stylesheet" href="/blora/blora.css?v=2.0.8">
  <link rel="stylesheet" href="/blora/tokens.dark.css?v=2.0.8">
</head>
<body class="blora-page">
  <div class="pi-wrap">
    <div class="pi-brand">CrewRouter <span class="brand-edition-badge" data-edition-badge hidden></span></div>
    <div id="pi-root" class="blora-card pi-card">
      <div class="pi-loading">正在获取插件信息…</div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(location.search);
      var pluginId = params.get('plugin') || '';
      var source = params.get('source') || location.origin;
      var root = document.getElementById('pi-root');

      var PERM_LABELS = {
        'storage': '读写插件私有存储',
        'network': '访问外部网络',
        'gateway:modify': '注册网关钩子（请求/响应/转发干预）',
        'provider:register': '注册上游格式/协议转换/供应商选择',
        'apikey:modify': 'API Key 校验与创建钩子',
        'billing:modify': '调整计费/配额',
        'cron:register': '声明定时任务',
        'pages:register': '新增控制台页面/插槽',
        'routes:register': '挂载自有 HTTP 接口',
        'themes:register': '注册界面主题'
      };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function permHtml(perms) {
        if (!perms || !perms.length) return '<li>（无）</li>';
        return perms.map(function (p) {
          var label = PERM_LABELS[p] || p;
          return '<li>' + esc(label) + (PERM_LABELS[p] ? ' <code>' + esc(p) + '</code>' : '') + '</li>';
        }).join('');
      }

      function behaviorHtml(beh) {
        beh = beh || {};
        var out = '';
        if (beh.pages && beh.pages.length) {
          out += '<li>新增页面：' + beh.pages.map(function (p) { return esc(p.title || p.id); }).join('、') + '</li>';
        }
        if (beh.slots && beh.slots.length) {
          out += '<li>注入界面插槽：' + beh.slots.map(function (s) { return esc((s.page || '') + ' / ' + (s.position || '')); }).join('、') + '</li>';
        }
        if (beh.routes && beh.routes.length) {
          out += '<li>新增 HTTP 接口：' + beh.routes.map(function (r) {
            return '<code>' + esc(String(r.method || 'get').toUpperCase()) + ' ' + esc(r.path || '') + '</code>';
          }).join('、') + '</li>';
        }
        if (beh.cron && beh.cron.length) {
          out += '<li>定时任务：' + beh.cron.map(function (c) { return '<code>' + esc(c.expr) + '</code>'; }).join('、') + '</li>';
        }
        if (beh.themes && beh.themes.length) {
          out += '<li>注册主题：' + beh.themes.map(function (t) { return esc(t.name || t.id); }).join('、') + '</li>';
        }
        if (beh.hooks && Object.keys(beh.hooks).length) {
          out += '<li>挂载钩子：' + Object.keys(beh.hooks).map(function (k) { return '<code>' + esc(k) + '</code>'; }).join('、') + '</li>';
        }
        return out || '<li>（无额外行为）</li>';
      }

      function render(info) {
        var html = '';
        html += '<div class="pi-title">' + esc(info.name) + '</div>';
        html += '<div class="pi-byline">v' + esc(info.version) + ' · ' + esc(info.author || info.authorUsername || '') + ' · <code>' + esc(info.id) + '</code></div>';
        if (info.description) html += '<div class="pi-desc">' + esc(info.description) + '</div>';

        html += '<div class="pi-section"><h3>权限</h3><ul>' + permHtml(info.permissions) + '</ul></div>';
        html += '<div class="pi-section"><h3>行为</h3><ul>' + behaviorHtml(info.behavior) + '</ul></div>';
        html += '<div class="blora-message pi-warn" data-variant="warning">安装后将立即启用该插件，并每日从插件商店检查是否有更新（若有更新会提醒系统管理员）。</div>';
        html += '<div class="pi-actions">' +
          '<button class="blora-button" data-variant="primary" id="piConfirm">确认安装</button>' +
          '<button class="blora-button" data-variant="outline" id="piCancel">取消</button>' +
        '</div>';

        root.innerHTML = html;
        var confirmBtn = document.getElementById('piConfirm');
        var cancelBtn = document.getElementById('piCancel');
        if (cancelBtn) cancelBtn.addEventListener('click', function () { window.history.back(); });
        if (confirmBtn) confirmBtn.addEventListener('click', function () { confirmInstall(); });
      }

      function renderError(title, msg, href) {
        root.innerHTML = '<div class="pi-err"><strong>' + esc(title) + '</strong>' + esc(msg) +
          (href ? '<div style="margin-top:10px;"><a class="pi-link" href="' + esc(href) + '">去登录</a></div>' : '') + '</div>';
      }

      function confirmInstall() {
        var btn = document.getElementById('piConfirm');
        if (btn) { btn.disabled = true; btn.textContent = '安装中…'; }
        fetch('/api/admin/plugins/install-from-store', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plugin: pluginId, source: source })
        }).then(function (r) {
          return r.json().then(function (d) { return { ok: r.ok, data: d }; });
        }).then(function (res) {
          if (res.ok) {
            root.innerHTML = '<div class="pi-err"><strong style="color:var(--primary,#2563eb);">安装成功</strong>' +
              esc(res.data.name || pluginId) + ' v' + esc(res.data.version || '') + ' 已启用。</div>' +
              '<div class="pi-actions"><a class="blora-button" data-variant="primary" href="/admin">前往插件管理</a></div>';
          } else {
            throw new Error((res.data && res.data.error) || ('HTTP ' + res.status));
          }
        }).catch(function (e) {
          var btn2 = document.getElementById('piConfirm');
          if (btn2) { btn2.disabled = false; btn2.textContent = '确认安装'; }
          renderError('安装失败', e.message);
        });
      }

      if (!pluginId) { renderError('缺少插件 id', '无法确定要安装的插件。'); }
      else {
        fetch('/api/admin/plugins/store-package?plugin=' + encodeURIComponent(pluginId) + '&source=' + encodeURIComponent(source))
          .then(function (r) {
            return r.json().then(function (d) { return { ok: r.ok, status: r.status, data: d }; });
          }).then(function (res) {
            if (res.status === 401) { renderError('请先登录', '你需要先登录到这个 CrewRouter，且为系统管理员。', '/'); return; }
            if (res.status === 403) { renderError('仅系统管理员可操作', '你没有系统管理员权限，无法安装插件。'); return; }
            if (!res.ok) { throw new Error((res.data && res.data.error) || ('HTTP ' + res.status)); }
            render(res.data.plugin);
          }).catch(function (e) {
            renderError('获取插件信息失败', e.message);
          });
      }
    })();
  </script>
</body>
</html>
