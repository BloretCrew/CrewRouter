<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var mode = localStorage.getItem('theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', !dark);
      document.documentElement.setAttribute('data-blora-color-scheme', dark ? 'dark' : 'light');
    }());
  </script>
  <title data-i18n="密钥用量详情">密钥用量详情</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/main.css?v=25">
  <link rel="stylesheet" href="/css/edition-badge.css?v=2">
  <link rel="stylesheet" href="/css/usage.css?v=1">
  <script src="/js/i18n.js?v=2"></script>
  <script type="module" src="/blora/auto.js?v=2.0.8"></script>
  <script src="/js/blora-foundation.js?v=2.0.8"></script>
  <link rel="stylesheet" href="/blora/blora.css?v=2.0.8">
  <link rel="stylesheet" href="/blora/tokens.dark.css?v=2.0.8">
</head>
<body class="blora-page usage-page">
  <main class="usage-shell">
    <header class="usage-header">
      <a class="usage-back-link" href="/console#apiKeys">
        <span aria-hidden="true">‹</span>
        <span data-i18n="返回 API Key 与用量">返回 API Key 与用量</span>
      </a>
      <div class="usage-language-wrap">
        <label for="langToggle" class="sr-only" data-i18n="语言">语言</label>
        <select id="langToggle" class="usage-language-select" title="Language">
          <option value="zh">中文</option>
          <option value="en">EN</option>
        </select>
      </div>
    </header>

    <section class="usage-card" aria-labelledby="usageTitle">
      <div class="usage-title-row">
        <div>
          <p class="usage-eyebrow" data-i18n="API Key 与用量">API Key 与用量</p>
          <h1 id="usageTitle"><span data-i18n="密钥用量详情">密钥用量详情</span></h1>
        </div>
        <span class="brand-edition-badge" data-edition-badge hidden></span>
      </div>
      <div id="usageState" class="usage-state" data-blora-state="loading" role="status" aria-live="polite">
        <div class="page-loading page-loading-compact">
          <div class="loading-spinner md" role="status" aria-label="加载中" data-i18n-title="加载中"></div>
          <div class="page-loading-text" data-i18n="加载中...">加载中...</div>
        </div>
      </div>
      <div id="usageContent" hidden></div>
    </section>
  </main>
  <script src="/js/edition-badge.js?v=1"></script>
  <script src="/js/usage.js?v=1"></script>
</body>
</html>
