<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var mode = localStorage.getItem('theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', !dark);
      document.documentElement.setAttribute('data-blora-color-scheme', dark ? 'dark' : 'light');
    }());
  </script>

  <title data-i18n="初始化设置 - CrewRouter">初始化设置 - CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script type="module" src="/blora/auto.js?v=2.0.8"></script>
  <script src="/js/blora-foundation.js"></script>
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth-shell.css">
  <link rel="stylesheet" href="/css/edition-badge.css?v=2">
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>

  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/edition-badge.js?v=1"></script>
  <link rel="stylesheet" href="/blora/blora.css?v=2.0.8">
  <link rel="stylesheet" href="/blora/tokens.dark.css?v=2.0.8">
</head>
<body class="blora-page">
<blora-navbar brand-href="/" title="CrewRouter" variant="floating" class="public-navbar">
  <blora-navbar-tool>
    <select id="langToggle" class="blora-input" data-size="sm" title="Language" aria-label="Language">
      <option value="zh">中文</option><option value="en">EN</option>
    </select>
  </blora-navbar-tool>
</blora-navbar>
  <div class="setup-container">
    <div class="setup-header">
      <h1>🚀 CrewRouter <span class="brand-edition-badge" data-edition-badge style="display:none;"></span></h1>
      <p><span data-i18n="首次使用，请创建管理员账号">首次使用，请创建管理员账号</span></p>
    </div>

    <div class="setup-card" id="stepLoading">
      <div class="setup-loading"><div class="page-loading"><div class="loading-spinner" role="status" aria-label="加载中" data-i18n-title="加载中"></div><div class="page-loading-text"><span data-i18n="正在检查系统状态…">正在检查系统状态…</span></div></div></div>
    </div>

    <div class="setup-card" id="stepEdition" style="display:none;">
      <h2>选择安装版本 / Choose edition</h2>
      <p class="step-desc step-warning">安装后不可修改，请谨慎选择。 / This choice is permanent.</p>
      <div class="setup-choice-list">
        <button class="btn btn-primary blora-button" data-variant="primary" type="button" onclick="setup.chooseEdition('personal')">Personal Edition（个人版）</button>
        <button class="btn btn-primary blora-button" data-variant="primary" type="button" onclick="setup.chooseEdition('team')">Team Edition（团队版）</button>
      </div>
      <div class="blora-message setup-error" data-variant="danger" id="editionError" role="alert"></div>
    </div>

    <div class="setup-card" id="stepMode" style="display:none;">
      <h2>选择账号系统模式</h2>
      <p class="step-desc step-warning">选择后不可修改，请谨慎选择。</p>
      <div class="setup-choice-list">
        <button class="btn btn-primary blora-button" data-variant="primary" onclick="setup.chooseMode('passport')">Bloret PassPort 模式</button>
        <button class="btn btn-primary blora-button" data-variant="primary" onclick="setup.chooseMode('feishu')">飞书模式</button>
      </div>
      <div class="blora-message setup-error" data-variant="danger" id="modeError" role="alert"></div>
    </div>

    <div class="setup-card" id="stepPassport" style="display:none;">
      <div class="setup-success">
        <h2>PassPort 首次授权</h2>
        <p>请使用管理员身份完成 Bloret PassPort 授权，授权成功后将自动创建管理员账号并进入控制台。</p>
        <button class="btn btn-primary blora-button" data-variant="primary" type="button" onclick="setup.startPassportAuth()">前往 PassPort 授权</button>
      </div>
    </div>

    <div class="setup-card" id="step1" style="display:none;">
      <h2><span data-i18n="创建管理员账号">创建管理员账号</span></h2>
      <p class="step-desc"><span data-i18n="数据库已就绪。创建后即可登录管理面板，在后台配置供应商与模型。">数据库已就绪。创建后即可登录管理面板，在后台配置供应商与模型。</span></p>
      <div class="setup-form">
        <div class="form-group">
          <label for="adminUsername"><span data-i18n="用户名">用户名</span></label>
          <input type="text" id="adminUsername" placeholder="admin" autocomplete="username" class="blora-input">
        </div>
        <div class="form-group">
          <label for="adminEmail"><span data-i18n="邮箱（可选）">邮箱（可选）</span></label>
          <input type="email" id="adminEmail" placeholder="admin@example.com" autocomplete="email" class="blora-input">
        </div>
        <div class="form-group">
          <label for="adminPassword"><span data-i18n="密码">密码</span></label>
          <input type="password" id="adminPassword" placeholder="至少 6 位" data-i18n-placeholder="至少 6 位" autocomplete="new-password" class="blora-input">
        </div>
      </div>
      <div class="blora-message setup-error" data-variant="danger" id="step1Error" role="alert"></div>
      <div class="setup-actions">
        <button class="btn btn-primary blora-button" data-variant="primary" id="submitBtn" onclick="setup.submit()"><span data-i18n="完成初始化">完成初始化</span></button>
      </div>
    </div>

    <div class="setup-card" id="stepDone" style="display:none;">
      <div class="setup-success">
        <h2><span data-i18n="✅ 设置完成！">✅ 设置完成！</span></h2>
        <p><span data-i18n="管理员账号已创建，请登录开始使用">管理员账号已创建，请登录开始使用</span></p>
        <button class="btn btn-primary blora-button" data-variant="primary" onclick="window.location.href='/'"><span data-i18n="前往登录">前往登录</span></button>
      </div>
    </div>

    <div class="setup-card" id="stepReady" style="display:none;">
      <div class="setup-success">
        <h2><span data-i18n="系统已初始化">系统已初始化</span></h2>
        <p><span data-i18n="无需重复配置，可直接登录">无需重复配置，可直接登录</span></p>
        <button class="btn btn-primary blora-button" data-variant="primary" onclick="window.location.href='/'"><span data-i18n="前往登录">前往登录</span></button>
      </div>
    </div>
  </div>

  <script>
    const setup = {
      async init() {
        try {
          console.log('[OOBE] 检查 setup 状态…');
          const res = await fetch('/api/setup/status');
          if (!res.ok) {
            throw new Error('状态接口返回 ' + res.status);
          }
          const data = await res.json();
          console.log('[OOBE] status:', data);
          document.getElementById('stepLoading').style.display = 'none';
          if (data.needsSetup) {
            if (!data.edition) {
              document.getElementById('stepEdition').style.display = 'block';
            } else if (data.authMode === 'passport') {
              document.getElementById('stepPassport').style.display = 'block';
            } else if (data.authMode === 'feishu') {
              document.getElementById('step1').style.display = 'block';
              document.getElementById('adminUsername').focus();
            } else {
              document.getElementById('stepMode').style.display = 'block';
            }
          } else {
            document.getElementById('stepReady').style.display = 'block';
          }
        } catch (e) {
          console.error('[OOBE] 状态检查失败:', e);
          const el = document.getElementById('stepLoading');
          el.innerHTML = '<div class="blora-message setup-error" data-variant="danger" role="alert">无法连接服务器或数据库尚未就绪，请确认服务已启动并完成数据库初始化后刷新本页。<br><small>' +
            (e && e.message ? e.message : '') + '</small></div>';
        }
      },

      async startPassportAuth() {
        const errorEl = document.getElementById('modeError');
        errorEl.style.display = 'none';
        try {
          const response = await fetch('/auth/passport/redirect-uri', { credentials: 'same-origin' });
          const data = await response.json().catch(() => ({}));
          if (data.redirectUri) {
            const origin = new URL(data.redirectUri).origin;
            window.location.href = `/auth/passport?redirect_origin=${encodeURIComponent(origin)}`;
            return;
          }
        } catch (_) {}

        const answer = window.prompt(
          `无法自动确认当前地址。\n请确认或输入 PassPort 接受的回调地址（例如 https://example.com）。`,
          window.location.origin
        );
        if (answer === null) return;
        const origin = answer.trim().replace(/\/$/, '');
        if (!origin) {
          errorEl.textContent = '请输入回调地址';
          errorEl.style.display = 'block';
          return;
        }
        try {
          const response = await fetch(`/auth/passport/redirect-uri?redirect_origin=${encodeURIComponent(origin)}`, { credentials: 'same-origin' });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.redirectUri) throw new Error(data.error || '公网地址无法使用');
          window.location.href = `/auth/passport?redirect_origin=${encodeURIComponent(origin)}`;
        } catch (error) {
          errorEl.textContent = error.message || '无法确认公网地址，请检查后重试';
          errorEl.style.display = 'block';
        }
      },

      async chooseEdition(edition) {
        const el = document.getElementById('editionError');
        el.style.display = 'none';
        try {
          let res = await fetch('/api/setup/edition', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ edition }) });
          let data = await res.json().catch(() => ({}));
          if (!res.ok && data.type === 'existing_installation_confirmation_required' && window.confirm(data.error + '\n\n继续后 edition 将永久固定，但不会删除或转换现有数据。')) {
            res = await fetch('/api/setup/edition', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ edition, confirmExisting: true }) });
            data = await res.json().catch(() => ({}));
          }
          if (!res.ok) throw new Error(data.error || 'edition 选择失败');
          if (window.CrewRouterEditionBadge) window.CrewRouterEditionBadge.refresh(data);
          document.getElementById('stepEdition').style.display = 'none';
          if (data.existingInstallation || data.setupComplete) {
            document.getElementById('stepReady').style.display = 'block';
            return;
          }
          document.getElementById('stepMode').style.display = 'block';
        } catch (e) { el.textContent = e.message; el.style.display = 'block'; }
      },

      async chooseMode(mode) {
        const el = document.getElementById('modeError');
        el.style.display = 'none';
        try {
          const res = await fetch('/api/setup/mode', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode }) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || '模式选择失败');
          document.getElementById('stepMode').style.display = 'none';
          if (mode === 'passport') {
            document.getElementById('stepPassport').style.display = 'block';
          } else {
            document.getElementById('step1').style.display = 'block';
            document.getElementById('adminUsername').focus();
          }
        } catch (e) { el.textContent = e.message; el.style.display = 'block'; }
      },

      showError(msg) {
        const el = document.getElementById('step1Error');
        el.textContent = msg;
        el.style.display = 'block';
      },

      async submit() {
        const errEl = document.getElementById('step1Error');
        errEl.style.display = 'none';
        const btn = document.getElementById('submitBtn');
        const username = document.getElementById('adminUsername').value.trim();
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;

        if (!username) { this.showError('请输入用户名'); return; }
        if (!password || password.length < 6) { this.showError('密码至少 6 位'); return; }

        btn.disabled = true;
        btn.innerHTML = `<span class="inline-loading"><div class="loading-spinner sm" role="status" aria-label="加载中"></div><span class="inline-loading-text">创建中…</span></span>`;
        console.log('[OOBE] 提交管理员创建:', username);

        try {
          const res = await fetch('/api/setup/admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email: email || undefined, password })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            console.error('[OOBE] 创建失败:', res.status, data);
            this.showError(data.error || ('创建失败 (' + res.status + ')'));
            btn.disabled = false;
            btn.textContent = '完成初始化';
            return;
          }
          console.log('[OOBE] 创建成功:', data);
          document.getElementById('step1').style.display = 'none';
          document.getElementById('stepDone').style.display = 'block';
        } catch (error) {
          console.error('[OOBE] 请求异常:', error);
          this.showError('请求失败，请重试');
          btn.disabled = false;
          btn.textContent = '完成初始化';
        }
      }
    };

    document.addEventListener('DOMContentLoaded', () => setup.init());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.getElementById('step1').style.display !== 'none') {
        setup.submit();
      }
    });
  </script>
<script>
  // Page-level i18n: apply catalog to static DOM once ready.
  (function () {
    function apply() { if (window.I18N) I18N.applyDom(); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', apply);
    } else { apply(); }
    document.addEventListener('i18n:ready', apply);
    var el = document.getElementById('langToggle');
    if (el && window.I18N) {
      el.value = I18N.current();
      el.addEventListener('change', function () { I18N.load(el.value); });
    }
  })();
</script>
</body>
</html>
