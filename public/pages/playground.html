<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/css/layers.css?v=2.1.0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var mode = localStorage.getItem('theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', !dark);
      document.documentElement.setAttribute('data-blora-color-scheme', dark ? 'dark' : 'light');
    }());
  </script>

  <title>Playground - CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script type="module" src="/blora/auto.js?v=2.1.0"></script>
  <script src="/js/blora-foundation.js"></script>
  <script src="/js/blora-dialog.js?v=5"></script>
  <style>@import url("/css/themes.css") layer(legacy);</style>
  <style>@import url("/css/main.css") layer(legacy);</style>
  <link rel="stylesheet" href="/css/playground.css">
  <style>@import url("/css/edition-badge.css?v=2") layer(legacy);</style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>
  <link rel="stylesheet" href="/blora/blora.css?v=2.1.0">
  <link rel="stylesheet" href="/blora/tokens.dark.css?v=2.1.0">
  <script type="module" src="/js/blora-services.js?v=2.1.0"></script>
</head>
<body class="blora-page blora-scope">
<div style="position:absolute;top:10px;right:12px;z-index:99;"><blora-select id="langToggle" aria-label="Language">
      <blora-option value="zh">中文</blora-option>
      <blora-option value="en">EN</blora-option>
    </blora-select></div>
  <div class="pg-container" data-blora-state="ready">
    <!-- 移动端顶栏 -->
    <div class="pg-mobile-bar">
      <a href="/console" class="pg-mobile-back">
        <span data-icon="chevron-left" aria-hidden="true"></span>
      </a>
      <span class="pg-mobile-title">CrewRouter <span class="brand-edition-badge" data-edition-badge hidden></span></span>
      <button id="pgToggleSidebar" class="pg-mobile-menu blora-button" type="button">
        <span data-icon="menu" aria-hidden="true"></span>
      </button>
    </div>

    <!-- 遮罩 -->
    <div id="pgOverlay" class="pg-overlay"></div>

    <!-- 左侧：对话历史 -->
    <aside class="pg-history-panel" id="pgHistoryPanel">
      <div class="pg-history-header">
        <div class="pg-history-header-top">
          <a href="/console" class="pg-back-link">
            <span data-icon="chevron-left" aria-hidden="true"></span><span data-i18n="返回控制台">
            返回控制台
          </span></a>
        </div>
        <div class="pg-history-header-row">
          <span class="pg-history-title"><span data-i18n="对话历史">对话历史</span></span>
          <button id="pgNewChatBtn" class="pg-history-new-btn blora-button" title="新对话" data-i18n-title="新对话" type="button">
          <span data-icon="plus" aria-hidden="true"></span><span data-i18n="新对话">
          新对话
        </span></button>
        </div>
      </div>
      <div class="pg-history-list" id="pgHistoryList">
        <blora-empty title="暂无对话记录"></blora-empty>
      </div>
    </aside>

    <!-- 中间：聊天区 -->
    <main class="pg-main">
      <div class="pg-messages" id="pgMessages">
        <div class="pg-welcome">
          <span data-icon="message-square" aria-hidden="true"></span>
          <h2>Crant AI Playground</h2>
          <p><span data-i18n="选择模型，开始对话。按 Enter 发送，Shift+Enter 换行。">选择模型，开始对话。按 Enter 发送，Shift+Enter 换行。</span></p>
        </div>
      </div>

      <div class="pg-reply-bar" id="pgReplyBar" style="display:none;">
        <span data-icon="chevron-left" aria-hidden="true"></span>
        <span class="pg-reply-preview" id="pgReplyPreview"></span>
        <button id="pgCancelReply" class="pg-reply-cancel blora-button" type="button">
          <span data-icon="x" aria-hidden="true"></span>
        </button>
      </div>
      <div class="pg-input-area">
        <div class="pg-input-wrapper">
          <blora-field class="pg-composer-field" aria-label="输入消息"><textarea id="pgInput" rows="1" class="blora-textarea" aria-label="输入消息" placeholder="输入消息..." data-i18n-placeholder="输入消息..."></textarea></blora-field>
          <button id="pgSendBtn" type="button" class="pg-send-btn blora-button" data-variant="primary" data-size="icon" title="发送" data-i18n-title="发送">
            <span data-icon="send" aria-hidden="true"></span>
          </button>
          <button id="pgStopBtn" type="button" class="pg-send-btn pg-stop-btn blora-button" data-variant="danger" data-size="icon" title="停止" data-i18n-title="停止" style="display:none;">
            <span data-icon="circle-stop" aria-hidden="true"></span>
          </button>
        </div>
        <div class="pg-input-footer">
          <button id="pgClearBtn" class="pg-clear-btn blora-button" type="button"><span data-i18n="清空对话">清空对话</span></button>
          <span class="pg-balance-badge" id="pgBalanceBadge"><span data-i18n="0 积分">0 积分</span></span>
        </div>
      </div>
    </main>

    <!-- 右侧：模型参数 -->
    <aside class="pg-settings-panel" id="pgSettingsPanel">
      <div class="pg-settings-scroll blora-stack">
        <div class="pg-setting-group blora-stack blora-stack--sm">
          <span class="blora-text-muted" data-i18n="模型">模型</span>
          <blora-select id="pgModel" name="model" aria-label="模型" data-blora-state="loading"></blora-select>
        </div>
        <blora-field label="系统提示词"><textarea id="pgSystemPrompt" class="blora-textarea" rows="4" placeholder="你是一个有用的助手..." data-i18n-placeholder="你是一个有用的助手..."></textarea></blora-field>
        <div class="pg-setting-group blora-stack blora-stack--sm">
          <label for="pgTemperature">Temperature: <span id="pgTempVal">1.0</span></label>
          <blora-slider id="pgTemperature" aria-label="Temperature" min="0" max="2" step="0.1" value="1.0"></blora-slider>
        </div>
        <blora-field label="Max Tokens"><input type="number" id="pgMaxTokens" class="blora-input" min="1" max="128000" value="4096"></blora-field>
        <div class="pg-setting-group blora-stack blora-stack--sm">
          <blora-switch id="pgThinkingToggle" checked label="思考模式"></blora-switch>
          <span class="pg-thinking-label blora-text-muted" id="pgThinkingLabel"><span data-i18n="已启用">已启用</span></span>
        </div>
        <div class="pg-setting-group blora-stack blora-stack--sm" id="pgThinkingBudgetGroup" style="display:none;">
          <label for="pgThinkingBudget"><span data-i18n="思考强度:">思考强度: </span><span id="pgThinkingBudgetVal">4096</span></label>
          <blora-slider id="pgThinkingBudget" aria-label="思考强度" min="1024" max="32768" step="1024" value="4096"></blora-slider>
        </div>
        <div class="pg-setting-group blora-stack blora-stack--sm" id="pgReasoningEffortGroup" style="display:none;">
          <span class="blora-text-muted" data-i18n="推理强度">推理强度</span>
          <blora-select id="pgReasoningEffort" name="reasoning_effort" aria-label="推理强度">
            <blora-option value="low">低</blora-option><blora-option value="medium" selected>中</blora-option><blora-option value="high">高</blora-option>
          </blora-select>
        </div>
      </div>

      <div class="pg-settings-footer">
        <div class="pg-stat">
          <span><span data-i18n="余额">余额</span></span>
          <span id="pgBalance">¥0.00</span>
        </div>
        <div class="pg-stat">
          <span><span data-i18n="本次消耗">本次消耗</span></span>
          <span id="pgCost">¥0.00</span>
        </div>
        <div class="pg-stat">
          <span>Tokens</span>
          <span id="pgTokens">0</span>
        </div>
        <button id="pgHistoryToggleBtn" class="pg-history-toggle-btn blora-button" title="查看历史记录" data-i18n-title="查看历史记录" type="button">
          <span data-icon="clock" aria-hidden="true"></span><span data-i18n="历史记录">
          历史记录
        </span></button>
      </div>
    </aside>

    <!-- 右侧：历史记录面板 -->
    <aside class="pg-history-detail-panel" id="pgHistoryDetailPanel" style="display:none;">
      <div class="pg-history-detail-header">
        <button id="pgHistoryBackBtn" class="pg-history-back-btn blora-button" type="button">
          <span data-icon="chevron-left" aria-hidden="true"></span><span data-i18n="返回设置">
          返回设置
        </span></button>
        <span class="pg-history-detail-title"><span data-i18n="历史记录">历史记录</span></span>
      </div>
      <div class="pg-history-detail-list" id="pgHistoryDetailList">
        <blora-empty title="暂无历史记录"></blora-empty>
      </div>
    </aside>

    <!-- 历史记录详情弹窗：Blora dialog contract -->
    <blora-dialog id="pgHistoryModal" class="pg-history-modal" size="lg" close-on-outside-click aria-labelledby="pgHistoryModalTitle">
      <div slot="header" class="pg-history-modal-header">
        <h3 id="pgHistoryModalTitle"><span data-i18n="对话详情">对话详情</span></h3>
        <button id="pgHistoryModalClose" type="button" class="blora-button pg-modal-close" data-variant="ghost" data-size="icon" aria-label="关闭">
          <span data-icon="x" aria-hidden="true"></span>
        </button>
      </div>
      <div class="pg-history-modal-body" id="pgHistoryModalBody"></div>
    </blora-dialog>
  </div>

  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/dom.js?v=3"></script>
  <script src="/js/edition-badge.js?v=1"></script>
  <script src="/js/playground-state.js?v=1"></script>
  <script src="/js/playground.js?v=3"></script>
<script>
  // Page-level i18n: apply catalog to static DOM once ready.
  (function () {
    function apply() { if (window.I18N) I18N.applyDom(); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', apply);
    } else { apply(); }
    document.addEventListener('i18n:ready', apply);
    var el = document.getElementById('langToggle');
    if (el && window.I18N) {
      el.value = I18N.current();
      el.addEventListener('change', function () { I18N.load(el.value); });
    }
  })();
</script>
</body>
</html>
