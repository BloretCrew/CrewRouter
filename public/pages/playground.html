<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Playground - CrewRouter</title>
<link href="/favicon.ico" rel="icon" sizes="any"/>
<link href="/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="/favicon-16.png" rel="icon" sizes="16x16" type="image/png"/>
<link href="/apple-touch-icon.png" rel="apple-touch-icon"/>
<link href="/blora/blora.css" rel="stylesheet"/>
<link href="/css/themes.css" rel="stylesheet"/>
<link href="/css/main.css" rel="stylesheet"/>
<link href="/css/playground.css" rel="stylesheet"/>
<script>
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>
<script src="/blora/auto.js" type="module"></script>
</head>
<body class="blora-page blora-scope">
<div style="position:absolute;top:10px;right:12px;z-index:99;"><blora-select id="langToggle" style="width:auto;height:28px;padding:0 6px;font-size:12px;cursor:pointer;" title="Language">
<blora-option value="zh">中文</blora-option>
<blora-option value="en">EN</blora-option>
</blora-select></div>
<div class="blora-button pg-container">
<!-- 移动端顶栏 -->
<div class="blora-button pg-mobile-bar">
<a class="blora-button pg-mobile-back" href="/console">
<img alt="chevron.left" class="sf-icon" data-sf-name="chevron.left" height="20" src="https://img.bloret.net/SF/chevron.left?color=white" style="display:inline-block;vertical-align:middle;" width="20"/>
</a>
<span class="blora-button pg-mobile-title">Playground</span>
<button type="button" class="blora-button pg-mobile-menu" id="pgToggleSidebar">
<img alt="line.3.horizontal" class="sf-icon" data-sf-name="line.3.horizontal" height="20" src="https://img.bloret.net/SF/line.3.horizontal?color=white" style="display:inline-block;vertical-align:middle;" width="20"/>
</button>
</div>
<!-- 遮罩 -->
<div class="blora-button pg-overlay" id="pgOverlay"></div>
<!-- 左侧：对话历史 -->
<aside class="blora-button pg-history-panel" id="pgHistoryPanel">
<div class="blora-button pg-history-header">
<div class="blora-button pg-history-header-top">
<a class="blora-button pg-back-link" href="/console">
<img alt="chevron.left" class="sf-icon" data-sf-name="chevron.left" height="16" src="https://img.bloret.net/SF/chevron.left?color=white" style="display:inline-block;vertical-align:middle;" width="16"/><span data-i18n="返回控制台">
            返回控制台
          </span></a>
</div>
<div class="blora-button pg-history-header-row">
<span class="blora-button pg-history-title"><span data-i18n="对话历史">对话历史</span></span>
<button type="button" class="blora-button pg-history-new-btn" data-i18n-title="新对话" id="pgNewChatBtn" title="新对话">
<img alt="plus" class="sf-icon" data-sf-name="plus" height="16" src="https://img.bloret.net/SF/plus?color=white" style="display:inline-block;vertical-align:middle;" width="16"/><span data-i18n="新对话">
          新对话
        </span></button>
</div>
</div>
<div class="blora-button pg-history-list" id="pgHistoryList">
<div class="blora-button pg-history-empty">
<img alt="message" class="sf-icon" data-sf-name="message" height="32" src="https://img.bloret.net/SF/message?color=white" style="display:inline-block;vertical-align:middle;opacity:0.3;margin-bottom:8px;" width="32"/>
<span><span data-i18n="暂无对话记录">暂无对话记录</span></span>
</div>
</div>
</aside>
<!-- 中间：聊天区 -->
<main class="blora-button pg-main">
<div class="blora-button pg-messages" id="pgMessages">
<div class="blora-button pg-welcome">
<img alt="message" class="sf-icon" data-sf-name="message" height="48" src="https://img.bloret.net/SF/message?color=brand-blue" style="display:inline-block;vertical-align:middle;margin-bottom:16px;opacity:0.6;" width="48"/>
<h2>Crant AI Playground</h2>
<p><span data-i18n="选择模型，开始对话。按 Enter 发送，Shift+Enter 换行。">选择模型，开始对话。按 Enter 发送，Shift+Enter 换行。</span></p>
</div>
</div>
<div class="blora-button pg-reply-bar" id="pgReplyBar" style="display:none;">
<img alt="chevron.left" class="sf-icon" data-sf-name="chevron.left" height="14" src="https://img.bloret.net/SF/chevron.left?color=white" style="display:inline-block;vertical-align:middle;" width="14"/>
<span class="blora-button pg-reply-preview" id="pgReplyPreview"></span>
<button type="button" class="blora-button pg-reply-cancel" id="pgCancelReply">
<img alt="xmark" class="sf-icon" data-sf-name="xmark" height="12" src="https://img.bloret.net/SF/xmark?color=white" style="display:inline-block;vertical-align:middle;" width="12"/>
</button>
</div>
<div class="blora-button pg-input-area">
<div class="blora-button pg-input-wrapper">
<textarea class="blora-textarea" data-i18n-placeholder="输入消息..." id="pgInput" placeholder="输入消息..." rows="1"></textarea>
<button type="button" class="blora-button pg-send-btn" data-i18n-title="发送" id="pgSendBtn" title="发送">
<img alt="paperplane" class="sf-icon" data-sf-name="paperplane" height="20" src="https://img.bloret.net/SF/paperplane?color=white" style="display:inline-block;vertical-align:middle;" width="20"/>
</button>
<button type="button" class="blora-button pg-send-btn pg-stop-btn" data-i18n-title="停止" id="pgStopBtn" style="display:none;" title="停止">
<img alt="stop.circle" class="sf-icon" data-sf-name="stop.circle" height="20" src="https://img.bloret.net/SF/stop.circle?color=white" style="display:inline-block;vertical-align:middle;" width="20"/>
</button>
</div>
<div class="blora-button pg-input-footer">
<button type="button" class="blora-button pg-clear-btn" id="pgClearBtn"><span data-i18n="清空对话">清空对话</span></button>
<span class="blora-button pg-balance-badge" id="pgBalanceBadge"><span data-i18n="0 积分">0 积分</span></span>
</div>
</div>
</main>
<!-- 右侧：模型参数 -->
<aside class="blora-button pg-settings-panel" id="pgSettingsPanel">
<div class="blora-button pg-settings-scroll">
<div class="blora-button pg-setting-group">
<label><span data-i18n="模型">模型</span></label>
<blora-select class="blora-select" id="pgModel"></blora-select>
</div>
<div class="blora-button pg-setting-group">
<label><span data-i18n="系统提示词">系统提示词</span></label>
<textarea class="blora-textarea" data-i18n-placeholder="你是一个有用的助手..." id="pgSystemPrompt" placeholder="你是一个有用的助手..." rows="4"></textarea>
</div>
<div class="blora-button pg-setting-group">
<label>Temperature: <span id="pgTempVal">1.0</span></label>
<blora-range class="range-input" id="pgTemperature" max="2" min="0" step="0.1" values="1.0,1.0"></blora-range>
</div>
<div class="blora-button pg-setting-group">
<label>Max Tokens</label>
<input class="blora-input" id="pgMaxTokens" max="128000" min="1" type="number" value="4096"/>
</div>
<div class="blora-button pg-setting-group">
<label><span data-i18n="思考模式">思考模式</span></label>
<div class="blora-button pg-thinking-controls">
<label class="blora-button pg-toggle">
<blora-switch checked="" id="pgThinkingToggle"></blora-switch>
<span class="blora-button pg-toggle-slider"></span>
</label>
<span class="blora-button pg-thinking-label" id="pgThinkingLabel"><span data-i18n="已启用">已启用</span></span>
</div>
</div>
<div class="blora-button pg-setting-group" id="pgThinkingBudgetGroup" style="display:none;">
<label><span data-i18n="思考强度:">思考强度: </span><span id="pgThinkingBudgetVal">4096</span></label>
<blora-range class="range-input" id="pgThinkingBudget" max="32768" min="1024" step="1024" values="4096,4096"></blora-range>
</div>
<div class="blora-button pg-setting-group" id="pgReasoningEffortGroup" style="display:none;">
<label><span data-i18n="推理强度">推理强度</span></label>
<blora-select class="blora-select" id="pgReasoningEffort">
<blora-option value="low"><span data-i18n="低">低</span></blora-option>
<blora-option selected="" value="medium"><span data-i18n="中">中</span></blora-option>
<blora-option value="high"><span data-i18n="高">高</span></blora-option>
</blora-select>
</div>
</div>
<div class="blora-button pg-settings-footer">
<div class="blora-button pg-stat">
<span><span data-i18n="余额">余额</span></span>
<span id="pgBalance">¥0.00</span>
</div>
<div class="blora-button pg-stat">
<span><span data-i18n="本次消耗">本次消耗</span></span>
<span id="pgCost">¥0.00</span>
</div>
<div class="blora-button pg-stat">
<span>Tokens</span>
<span id="pgTokens">0</span>
</div>
<button type="button" class="blora-button pg-history-toggle-btn" data-i18n-title="查看历史记录" id="pgHistoryToggleBtn" title="查看历史记录">
<img alt="clock" class="sf-icon" data-sf-name="clock" height="16" src="https://img.bloret.net/SF/clock?color=white" style="display:inline-block;vertical-align:middle;" width="16"/><span data-i18n="历史记录">
          历史记录
        </span></button>
</div>
</aside>
<!-- 右侧：历史记录面板 -->
<aside class="blora-button pg-history-detail-panel" id="pgHistoryDetailPanel" style="display:none;">
<div class="blora-button pg-history-detail-header">
<button type="button" class="blora-button pg-history-back-btn" id="pgHistoryBackBtn">
<img alt="chevron.left" class="sf-icon" data-sf-name="chevron.left" height="16" src="https://img.bloret.net/SF/chevron.left?color=white" style="display:inline-block;vertical-align:middle;" width="16"/><span data-i18n="返回设置">
          返回设置
        </span></button>
<span class="blora-button pg-history-detail-title"><span data-i18n="历史记录">历史记录</span></span>
</div>
<div class="blora-button pg-history-detail-list" id="pgHistoryDetailList">
<div class="blora-button pg-history-detail-empty">
<img alt="clock" class="sf-icon" data-sf-name="clock" height="32" src="https://img.bloret.net/SF/clock?color=white" style="display:inline-block;vertical-align:middle;opacity:0.3;margin-bottom:8px;" width="32"/>
<span><span data-i18n="暂无历史记录">暂无历史记录</span></span>
</div>
</div>
</aside>
<!-- 历史记录详情弹窗 -->
<blora-dialog id="pgHistoryModal" size="lg"><div slot="header">
<h3 id="pgHistoryModalTitle"><span data-i18n="对话详情">对话详情</span></h3>
</div><div id="pgHistoryModalBody"></div>
</blora-dialog>
<script src="/js/i18n.js?v=2"></script>
<script src="/js/theme.js?v=2"></script>
<script src="/js/dom.js?v=9"></script>
<script src="/js/playground.js?v=4"></script>
<script>
  // Page-level i18n: apply catalog to static DOM once ready.
  (function () {
    function apply() { if (window.I18N) I18N.applyDom(); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', apply);
    } else { apply(); }
    document.addEventListener('i18n:ready', apply);
    var el = document.getElementById('langToggle');
    if (el && window.I18N) {
      el.value = I18N.current();
      el.addEventListener('change', function () { I18N.load(el.value); });
    }
  })();
</script>
</body>
</html>
