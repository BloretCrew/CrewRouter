<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="插件商店 - CrewRouter">插件商店 - CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/store.css?v=1">
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>
</head>
<body>
<div style="position:absolute;top:10px;right:12px;z-index:99;"><select id="langToggle" class="btn btn-icon" title="Language" style="width:auto;height:28px;padding:0 6px;font-size:12px;cursor:pointer;">
      <option value="zh">中文</option>
      <option value="en">EN</option>
    </select></div>

  <div class="store-shell">
    <header class="store-header">
      <div class="store-header__left">
        <a class="store-brand" href="/store">
          <img src="https://img.bloret.net/img/1778334791692/7cf47c179900187457dc3abba0eaf918" alt="CrewRouter" width="26" height="26" style="border-radius:6px;">
          <span class="store-brand__name">CrewRouter</span>
          <span class="store-brand__tag"><span data-i18n="插件商店">插件商店</span></span>
        </a>
      </div>
      <nav class="store-nav">
        <a class="store-nav__link" href="/store"><span data-i18n="浏览">浏览</span></a>
        <a class="store-nav__link" id="navMine" href="/store#/mine" style="display:none;"><span data-i18n="我的插件">我的插件</span></a>
        <a class="store-nav__link" id="navSubmit" href="/store#/submit"><span data-i18n="提交插件">提交插件</span></a>
        <a class="store-nav__link" id="navAdmin" href="/store#/admin" style="display:none;"><span data-i18n="审核">审核</span></a>
        <a class="store-nav__link" href="/data"><span data-i18n="统计">统计</span></a>
        <span class="store-nav__spacer"></span>
        <span class="store-nav__user" id="storeUserBox" style="display:none;"></span>
        <button class="btn btn-sm btn-secondary" id="storeLoginBtn"><span data-i18n="登录">登录</span></button>
        <button class="btn btn-sm btn-outline" id="storeLogoutBtn" style="display:none;"><span data-i18n="登出">登出</span></button>
      </nav>
    </header>

    <div class="store-banner" id="storeBanner" style="display:none;"></div>

    <main class="store-main" id="store-view">
      <div class="page-loading"><div class="loading-spinner" role="status" aria-label="加载中" data-i18n-title="加载中"></div><div class="page-loading-text"><span data-i18n="加载中...">加载中...</span></div></div>
    </main>
  </div>

  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/store.js?v=3"></script>
  <script>
    (function () {
      function apply() { if (window.I18N) I18N.applyDom(); }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', apply);
      } else { apply(); }
      document.addEventListener('i18n:ready', apply);
      var el = document.getElementById('langToggle');
      if (el && window.I18N) {
        el.value = I18N.current();
        el.addEventListener('change', function () { I18N.load(el.value); });
      }
    })();
  </script>
</body>
</html>
