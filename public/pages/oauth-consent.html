<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="授权确认 - CrewRouter">授权确认 - CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/blora/blora.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/main.css">
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>
  <style>
    body {
      font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", sans-serif);
      background: var(--background, #f9fafb);
      color: var(--foreground, #111827);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .oc-card {
      width: 100%;
      max-width: 440px;
      background: var(--card, #fff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: var(--radius, 14px);
      padding: 28px 26px;
      box-shadow: var(--shadow-login, 0 8px 30px rgba(0,0,0,0.08));
      box-sizing: border-box;
    }
    .oc-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .oc-brand img { width: 34px; height: 34px; border-radius: 8px; }
    .oc-brand span { font-size: 17px; font-weight: 700; letter-spacing: 0.2px; }
    .oc-title { font-size: 18px; font-weight: 700; text-align: center; margin: 0 0 6px; }
    .oc-sub { font-size: 13.5px; color: var(--muted-foreground, #6b7280); text-align: center; margin: 0 0 18px; line-height: 1.6; }
    .oc-sub strong { color: var(--foreground, #111827); }
    .oc-section-label { font-size: 12.5px; font-weight: 600; color: var(--muted-foreground, #6b7280); margin: 16px 0 8px; }
    .oc-scopes { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border, #e5e7eb); border-radius: 10px; overflow: hidden; }
    .oc-scopes li { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; font-size: 13.5px; line-height: 1.55; }
    .oc-scopes li + li { border-top: 1px solid var(--border, #e5e7eb); }
    .oc-scopes code { background: var(--muted, #f3f4f6); padding: 1px 6px; border-radius: 4px; font-size: 11.5px; white-space: nowrap; }
    .oc-scope-check { color: var(--brand-blue, #1456f0); flex-shrink: 0; margin-top: 1px; }
    select.oc-select {
      width: 100%; box-sizing: border-box; height: 38px; padding: 0 10px;
      border: 1px solid var(--input, #e5e7eb); border-radius: 8px;
      background: var(--card, #fff); color: var(--foreground, #111827);
      font-size: 13.5px; cursor: pointer;
    }
    .oc-hint { font-size: 12px; color: var(--muted-foreground, #6b7280); margin-top: 6px; line-height: 1.5; }
    .oc-actions { display: flex; gap: 10px; margin-top: 22px; }
    .oc-btn { flex: 1; height: 40px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: opacity .15s ease; }
    .oc-btn:hover { opacity: 0.88; }
    .oc-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .oc-btn-approve { background: var(--primary, #181e25); color: var(--primary-foreground, #fff); }
    .oc-btn-deny { background: transparent; color: var(--muted-foreground, #6b7280); border-color: var(--border, #e5e7eb); }
    .oc-error {
      display: none; margin-bottom: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.6;
      background: color-mix(in srgb, var(--destructive, #ef4444) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--destructive, #ef4444) 35%, transparent);
      color: var(--destructive, #ef4444);
    }
    .oc-loading { text-align: center; padding: 36px 0; color: var(--muted-foreground, #6b7280); font-size: 13.5px; }
  </style>
  <script type="module" src="/blora/auto.js"></script>
</head>
<body class="blora-page blora-scope">
  <div style="position:absolute;top:10px;right:12px;z-index:99;">
    <blora-select id="langToggle" title="Language" style="width:auto;height:28px;padding:0 6px;font-size:12px;cursor:pointer;border:1px solid var(--border,#e5e7eb);border-radius:6px;background:var(--card,#fff);color:var(--foreground,#111827);">
      <blora-option value="zh">中文</blora-option>
      <blora-option value="en">EN</blora-option>
    </blora-select>
  </div>

  <div class="oc-card">
    <div class="oc-brand">
      <img src="/favicon-32.png" alt="">
      <span>CrewRouter</span>
    </div>

    <div id="ocError" class="oc-error"></div>

    <!-- 加载中 -->
    <div id="ocLoading" class="oc-loading"><span data-i18n="加载中...">加载中...</span></div>

    <!-- 授权表单：原生提交 → 服务端 302 回 loopback 回调地址 -->
    <form id="ocForm" method="POST" action="/oauth/authorize/approve" style="display:none;">
      <h1 class="oc-title" data-i18n="授权请求">授权请求</h1>
      <p class="oc-sub">
        <strong id="ocAppName">-</strong>
        <span data-i18n="正在请求访问你的 CrewRouter 账号">正在请求访问你的 CrewRouter 账号</span>
      </p>

      <div class="oc-section-label" data-i18n="申请的权限">申请的权限</div>
      <ul id="ocScopeList" class="oc-scopes"></ul>

      <div class="oc-section-label" data-i18n="选择用于本次授权的 API Key">选择用于本次授权的 API Key</div>
      <blora-select id="ocApiKeySelect" name="api_key_id" class="blora-select"></blora-select>
      <div class="oc-hint" data-i18n="本次授权将以所选密钥的身份行事，用量与计费归属该密钥。">本次授权将以所选密钥的身份行事，用量与计费归属该密钥。</div>

      <div id="ocHiddenFields"></div>

      <div class="oc-actions">
        <button type="submit" name="decision" value="approve" id="ocApproveBtn" class="blora-button oc-btn oc-btn-approve" data-i18n="同意授权">同意授权</button>
        <button type="submit" name="decision" value="deny" id="ocDenyBtn" class="blora-button oc-btn oc-btn-deny" data-i18n="拒绝">拒绝</button>
      </div>
    </form>
  </div>

  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/oauth-consent.js?v=2"></script>
  <script>
    // Page-level i18n: apply catalog to static DOM once ready.
    (function () {
      function apply() { if (window.I18N) I18N.applyDom(); }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', apply);
      } else { apply(); }
      document.addEventListener('i18n:ready', apply);
      var el = document.getElementById('langToggle');
      if (el && window.I18N) {
        el.value = I18N.current();
        el.addEventListener('change', function () { I18N.load(el.value); });
      }
    })();
  </script>
</body>
</html>
