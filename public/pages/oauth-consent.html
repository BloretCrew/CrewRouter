<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var mode = localStorage.getItem('theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', !dark);
      document.documentElement.setAttribute('data-blora-color-scheme', dark ? 'dark' : 'light');
    }());
  </script>

  <title data-i18n="授权确认 - CrewRouter">授权确认 - CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script type="module" src="/blora/auto.js?v=2.0.8"></script>
  <link rel="stylesheet" href="/blora/blora.css?v=2.0.8">
  <link rel="stylesheet" href="/blora/tokens.dark.css?v=2.0.8">
  <script src="/js/blora-foundation.js?v=2.0.8"></script>
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth-shell.css?v=2">
  <link rel="stylesheet" href="/css/edition-badge.css?v=1">
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>
</head>
<body class="blora-page">
  <main class="auth-page login-container">
    <section class="blora-card auth-card login-card oc-card" aria-labelledby="auth-title">
      <header class="auth-card__header">
        <span class="auth-card__logo" aria-hidden="true"><img src="https://img.bloret.net/img/1778334791692/7cf47c179900187457dc3abba0eaf918" alt=""></span>
        <h1 id="auth-title">CrewRouter <span class="brand-edition-badge" data-edition-badge hidden></span></h1>
        <p data-i18n="授权请求">授权请求</p>
      </header>

      <div id="ocError" class="blora-message auth-error" data-variant="danger" role="alert"></div>

      <!-- 加载中 -->
      <div id="ocLoading" class="oc-loading" role="status"><span class="blora-spinner" aria-hidden="true"></span><span data-i18n="加载中...">加载中...</span></div>

      <!-- 授权表单：原生提交 → 服务端 302 回 loopback 回调地址 -->
      <form id="ocForm" method="POST" action="/oauth/authorize/approve" hidden>
        <p class="oc-sub">
          <strong id="ocAppName">-</strong>
          <span data-i18n="正在请求访问你的 CrewRouter 账号">正在请求访问你的 CrewRouter 账号</span>
        </p>

        <div class="oc-section-label" data-i18n="申请的权限">申请的权限</div>
        <ul id="ocScopeList" class="blora-list oc-scopes"></ul>

        <blora-select id="ocApiKeySelect" name="api_key_id" label="选择用于本次授权的 API Key" required></blora-select>
        <div class="oc-hint" data-i18n="本次授权将以所选密钥的身份行事，用量与计费归属该密钥。">本次授权将以所选密钥的身份行事，用量与计费归属该密钥。</div>

        <div id="ocHiddenFields"></div>

        <div class="oc-actions">
          <button type="submit" name="decision" value="approve" id="ocApproveBtn" class="blora-button" data-variant="primary" data-i18n="同意授权">同意授权</button>
          <button type="submit" name="decision" value="deny" id="ocDenyBtn" class="blora-button" data-variant="outline" data-i18n="拒绝">拒绝</button>
        </div>
      </form>

      <footer class="auth-card__footer">
        <blora-dropdown id="langToggle" class="auth-lang" label="中文" align="center" aria-label="选择语言"><blora-dropdown-item value="zh" href="?lang=zh">中文</blora-dropdown-item><blora-dropdown-item value="en" href="?lang=en">EN</blora-dropdown-item></blora-dropdown>
        <button id="themeToggle" class="blora-button" data-variant="ghost" data-size="sm" type="button" title="切换主题" data-i18n-title="切换主题" aria-label="切换主题"><img class="icon-sun sf-icon" src="https://img.bloret.net/SF/sun.max?color=white" alt="" width="18" height="18" data-sf-name="sun.max"><img class="icon-moon sf-icon" src="https://img.bloret.net/SF/moon?color=white" alt="" width="18" height="18" data-sf-name="moon" style="display:none"><img class="icon-system sf-icon" src="https://img.bloret.net/SF/desktopcomputer?color=white" alt="" width="18" height="18" data-sf-name="desktopcomputer" style="display:none"></button>
      </footer>
    </section>
  </main>

  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/edition-badge.js?v=1"></script>
  <script src="/js/oauth-consent.js?v=2"></script>
  <script>
    // Page-level i18n: apply catalog to static DOM once ready.
    (function () {
      function apply() { if (window.I18N) I18N.applyDom(); }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', apply);
      } else { apply(); }
      document.addEventListener('i18n:ready', apply);
      // 语言菜单保留当前查询参数，避免丢失授权请求参数
      var qs = new URLSearchParams(window.location.search);
      document.querySelectorAll('#langToggle blora-dropdown-item').forEach(function (item) {
        qs.set('lang', item.getAttribute('value'));
        item.setAttribute('href', window.location.pathname + '?' + qs.toString());
      });
    })();
  </script>
</body>
</html>
