<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/blora/blora.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/main.css">
  <script>
    // Prevent FOUC - apply theme immediately
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>
  <script>
    // 检查是否需要 OOBE，然后检查登录状态
    (async function() {
      try {
        // 先检查是否需要初始化（仅创建管理员一步）
        const setupRes = await fetch('/api/setup/status');
        if (setupRes.ok) {
          const setupData = await setupRes.json();
          if (setupData.needsSetup) {
            window.location.replace('/setup');
            return;
          }
        } else if (setupRes.status === 503) {
          // 数据库尚未就绪时也进入 setup 页提示用户等待
          window.location.replace('/setup');
          return;
        }
      } catch {}
      try {
        const res = await fetch('/auth/me', { credentials: 'same-origin' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.id) {
            window.location.replace('/console');
          }
        }
      } catch {}
    })();
  </script>
  <script type="module" src="/blora/auto.js"></script>
</head>
<body class="blora-page blora-scope">
  <div class="login-container">
    <div class="login-bg">
      <div class="grid"></div>
    </div>

    <div class="theme-toggle" style="position:fixed;right:16px;top:16px;z-index:50;">
      <select id="langToggle" class="btn btn-icon" title="Language" style="width:auto;height:28px;padding:0 6px;font-size:12px;cursor:pointer;">
      <option value="zh">中文</option>
      <option value="en">EN</option>
    </select>
      <button id="themeToggle" class="btn btn-icon" title="切换主题" data-i18n-title="切换主题" data-variant="secondary" type="button">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-system" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </button>
    </div>

    <div class="login-card">
      <div class="logo">
        <div style="display:flex;align-items:center;justify-content:center;gap:12px;">
          <img src="https://img.bloret.net/img/1778334791692/7cf47c179900187457dc3abba0eaf918" alt="Logo" style="width:40px;height:40px;border-radius:10px;">
          <h1>CrewRouter</h1>
        </div>
        <p><span data-i18n="统一 AI 模型接入平台">统一 AI 模型接入平台</span></p>
      </div>

      <div class="login-form">
        <div id="errorMessage" class="error-message"></div>
        <div class="divider"><span><span data-i18n="安全登录">安全登录</span></span></div>

        <!-- 登录表单 -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <input type="text" id="loginInput" placeholder="用户名或邮箱" data-i18n-placeholder="用户名或邮箱" class="input" required autocomplete="username">
          </div>
          <div class="form-group">
            <input type="password" id="password" placeholder="密码（至少6位）" data-i18n-placeholder="密码（至少6位）" class="input" minlength="6" required autocomplete="current-password">
          </div>
          <button type="submit" class="login-btn" id="submitBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            <span id="submitText"><span data-i18n="登录">登录</span></span>
          </button>
        </form>

        <!-- PassKey 登录 -->
        <div id="passkeyLoginSection" class="login-alt-actions" style="display: none;">
          <button type="button" class="login-btn login-btn-secondary" id="passkeyLoginBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
            </svg>
            <span id="passkeyLoginText"><span data-i18n="使用通行密钥登录">使用通行密钥登录</span></span>
          </button>
        </div>

        <!-- 2FA 验证表单（隐藏） -->
        <form id="twoFactorForm" style="display: none;" onsubmit="handle2FAVerify(event)">
          <div class="form-group">
            <label for="tfaCode"><span data-i18n="请输入验证码">请输入验证码</span></label>
            <input type="text" id="tfaCode" placeholder="6位验证码" data-i18n-placeholder="6位验证码" class="input" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required>
          </div>
          <button type="submit" class="login-btn" id="tfaSubmitBtn">
            <span><span data-i18n="验证">验证</span></span>
          </button>
          <button type="button" class="login-btn login-btn-secondary" onclick="cancel2FA()">
            <span><span data-i18n="取消">取消</span></span>
          </button>
        </form>

        <!-- 第三方登录（按账号系统模式显示） -->
        <div id="passportLoginSection" class="login-oauth" style="display: none;">
          <a href="/auth/passport" id="passportLoginLink" class="login-btn login-btn-feishu"><span>使用 Bloret PassPort 登录</span></a>
        </div>
        <div id="feishuLoginSection" class="login-oauth" style="display: none;">
          <a href="/auth/feishu" class="login-btn login-btn-feishu">
            <img src="https://img.bloret.net/img/1781924869641/fb4655afd7cf96acaa2f050c144979e7" alt="" width="20" height="20" style="border-radius:4px;">
            <span><span data-i18n="使用飞书登录">使用飞书登录</span></span>
          </a>
        </div>

      </div>

      <div class="login-footer">
        <p><span data-i18n="登录即表示您同意我们的服务条款">登录即表示您同意我们的服务条款</span></p>
        <div class="links">
          <a href="#"><span data-i18n="服务条款">服务条款</span></a>
          <a href="#"><span data-i18n="隐私政策">隐私政策</span></a>
          <a href="#"><span data-i18n="帮助中心">帮助中心</span></a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/theme.js?v=2"></script>
  <script>
    (function () {
      const invite = new URLSearchParams(window.location.search).get('invite');
      if (invite && /^[A-Za-z0-9_-]{20,200}$/.test(invite)) {
        sessionStorage.setItem('passportInvite', invite);
        window.history.replaceState({}, document.title, window.location.pathname + window.location.hash);
      }
    })();
    (async function () {
      try {
        const r = await fetch('/auth/status');
        const d = await r.json();
        const feishu = document.getElementById('feishuLoginSection');
        const passport = document.getElementById('passportLoginSection');
        if (d.authMode === 'passport') { if (passport) passport.style.display = 'block'; if (feishu) feishu.style.display = 'none'; }
        else if (d.feishuEnabled && feishu) feishu.style.display = 'block';
        const link = document.getElementById('passportLoginLink');
        const storedInvite = sessionStorage.getItem('passportInvite');
        if (link && storedInvite) link.href = `/auth/passport?invite=${encodeURIComponent(storedInvite)}`;
      } catch (_) {}
    })();
  </script>
  <script>
    let pending2FAUserId = null;

    async function handleLogin(e) {
      e.preventDefault();
      const loginInput = document.getElementById('loginInput').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const submitTextEl = document.getElementById('submitText');
      const errorEl = document.getElementById('errorMessage');

      submitBtn.disabled = true;
      if (submitTextEl) submitTextEl.innerHTML = `<span class="inline-loading"><div class="loading-spinner sm" role="status" aria-label="加载中"></div><span class="inline-loading-text">处理中...</span></span>`;
      errorEl.classList.remove('show');

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ login: loginInput, password })
        });

        const data = await res.json();

        if (res.ok) {
          if (data.require2FA) {
            pending2FAUserId = data.userId;
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('twoFactorForm').style.display = 'block';
            document.getElementById('tfaCode').focus();
            return;
          }
          window.location.href = '/console';
          return;
        } else {
          errorEl.textContent = data.error || '登录失败';
          errorEl.classList.add('show');
        }
      } catch (err) {
        errorEl.textContent = '网络错误，请稍后重试';
        errorEl.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        if (submitTextEl) submitTextEl.textContent = '登录';
      }
    }

    async function handle2FAVerify(e) {
      e.preventDefault();
      const code = document.getElementById('tfaCode').value;
      const submitBtn = document.getElementById('tfaSubmitBtn');
      const errorEl = document.getElementById('errorMessage');
      
      submitBtn.disabled = true;
      errorEl.classList.remove('show');
      
      try {
        const res = await fetch('/auth/login/2fa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ userId: pending2FAUserId, code })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          window.location.href = '/console';
          return;
        } else {
          errorEl.textContent = data.error || '验证失败';
          errorEl.classList.add('show');
        }
      } catch (err) {
        errorEl.textContent = '网络错误，请稍后重试';
        errorEl.classList.add('show');
      } finally {
        submitBtn.disabled = false;
      }
    }

    function cancel2FA() {
      pending2FAUserId = null;
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('twoFactorForm').style.display = 'none';
      document.getElementById('tfaCode').value = '';
      document.getElementById('errorMessage').classList.remove('show');
    }

    // ========== PassKey 登录 ==========
    function base64urlToBuffer(base64url) {
      if (!base64url) return new ArrayBuffer(0);
      let base64 = String(base64url).replace(/-/g, '+').replace(/_/g, '/');
      const pad = base64.length % 4;
      if (pad) base64 += '='.repeat(4 - pad);
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    function bufferToBase64url(buffer) {
      if (!buffer) return '';
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    function preparePublicKeyOptions(options) {
      const result = { ...options };
      if (result.challenge && typeof result.challenge === 'string') {
        result.challenge = base64urlToBuffer(result.challenge);
      }
      if (result.allowCredentials && Array.isArray(result.allowCredentials)) {
        result.allowCredentials = result.allowCredentials.map(cred => ({
          ...cred,
          id: typeof cred.id === 'string' ? base64urlToBuffer(cred.id) : cred.id,
        }));
      }
      return result;
    }

    function prepareAuthenticationResponse(credential) {
      const rawId = bufferToBase64url(credential.rawId);
      const clientExtensionResults =
        typeof credential.getClientExtensionResults === 'function'
          ? credential.getClientExtensionResults()
          : {};
      const response = {
        clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
        authenticatorData: bufferToBase64url(credential.response.authenticatorData),
        signature: bufferToBase64url(credential.response.signature),
      };
      if (credential.response.userHandle) {
        response.userHandle = bufferToBase64url(credential.response.userHandle);
      }
      return {
        id: rawId,
        rawId,
        type: credential.type,
        authenticatorAttachment: credential.authenticatorAttachment || undefined,
        clientExtensionResults,
        response,
      };
    }

    async function handlePasskeyLogin() {
      const errorEl = document.getElementById('errorMessage');
      const btn = document.getElementById('passkeyLoginBtn');
      const textEl = document.getElementById('passkeyLoginText');
      const loginInput = document.getElementById('loginInput');

      errorEl.classList.remove('show');
      btn.disabled = true;
      if (textEl) textEl.innerHTML = `<span class="inline-loading"><div class="loading-spinner sm" role="status" aria-label="加载中"></div><span class="inline-loading-text">验证中…</span></span>`;

      try {
        const username = (loginInput && loginInput.value || '').trim();
        const optRes = await fetch('/api/passkey/login/options', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(username ? { username } : {}),
        });
        const options = await optRes.json();
        if (!optRes.ok) {
          throw new Error(options.error || '获取通行密钥选项失败');
        }

        // 保存 challenge 字符串供服务端校验
        const challenge = options.challenge;
        const publicKey = preparePublicKeyOptions(options);

        const credential = await navigator.credentials.get({ publicKey });
        if (!credential) {
          throw new Error('用户取消了通行密钥验证');
        }

        const authBody = prepareAuthenticationResponse(credential);
        const verifyRes = await fetch('/api/passkey/login/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: username || undefined,
            body: authBody,
            challenge,
          }),
        });
        const data = await verifyRes.json();
        if (!verifyRes.ok || !data.success) {
          throw new Error(data.error || '通行密钥登录失败');
        }
        window.location.href = '/console';
      } catch (err) {
        console.error('PassKey 登录失败:', err);
        const msg = err.name === 'NotAllowedError'
          ? '操作已取消或超时'
          : (err.message || '通行密钥登录失败');
        errorEl.textContent = msg;
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
        if (textEl) textEl.textContent = '使用通行密钥登录';
      }
    }

    // 支持 WebAuthn 时显示 PassKey 登录
    (function initPasskeyLogin() {
      const section = document.getElementById('passkeyLoginSection');
      const btn = document.getElementById('passkeyLoginBtn');
      if (!section || !btn) return;
      if (window.PublicKeyCredential) {
        section.style.display = '';
        btn.addEventListener('click', handlePasskeyLogin);
      }
    })();

    // 检查飞书登录是否可用
    (async function checkFeishuLogin() {
      const section = document.getElementById('feishuLoginSection');
      if (!section) return;
      try {
        console.log('[登录页] 正在查询飞书登录状态…');
        const res = await fetch('/auth/feishu/status', { credentials: 'same-origin' });
        if (!res.ok) {
          console.warn('[登录页] 飞书状态接口异常, status=', res.status);
          return;
        }
        const data = await res.json();
        console.log('[登录页] 飞书登录状态:', data);
        if (data && data.enabled) {
          section.style.display = '';
          console.log('[登录页] 已显示飞书登录按钮');
        } else {
          section.style.display = 'none';
          console.log('[登录页] 飞书登录未启用，隐藏按钮');
        }
      } catch (err) {
        console.error('[登录页] 查询飞书状态失败:', err);
      }
    })();

    // 显示错误信息
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const success = params.get('success');
    if (error) {
      const errorEl = document.getElementById('errorMessage');
      const errors = {
        'session_failed': '会话保存失败',
        'feishu_state_invalid': '飞书登录失败：安全校验不通过，请重试',
        'feishu_no_code': '飞书登录失败：未收到授权码',
        'feishu_token_failed': '飞书登录失败：获取 Token 失败',
        'feishu_userinfo_failed': '飞书登录失败：获取用户信息失败',
        'feishu_not_enterprise': '飞书登录失败：非企业用户，请使用企业飞书账号登录',
        'feishu_invalid_domain': '飞书登录失败：邮箱域名不在白名单内',
        'feishu_error': '飞书登录失败，请稍后重试'
      };
      errorEl.textContent = errors[error] || '登录失败：未知错误';
      errorEl.classList.add('show');
      window.history.replaceState({}, document.title, '/');
    }
    if (success) {
      const errorEl = document.getElementById('errorMessage');
      const successes = {
        'github_bound': 'GitHub 账号绑定成功'
      };
      if (successes[success]) {
        errorEl.textContent = successes[success];
        errorEl.style.color = '#4caf50';
        errorEl.classList.add('show');
      }
      window.history.replaceState({}, document.title, '/');
    }
  </script>
<script>
  // Page-level i18n: apply catalog to static DOM once ready.
  (function () {
    function apply() { if (window.I18N) I18N.applyDom(); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', apply);
    } else { apply(); }
    document.addEventListener('i18n:ready', apply);
    var el = document.getElementById('langToggle');
    if (el && window.I18N) {
      el.value = I18N.current();
      el.addEventListener('change', function () { I18N.load(el.value); });
    }
  })();
</script>
</body>
</html>
