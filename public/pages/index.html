<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var mode = localStorage.getItem('theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', !dark);
      document.documentElement.setAttribute('data-blora-color-scheme', dark ? 'dark' : 'light');
    }());
  </script>

  <title>CrewRouter</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script type="module" src="/blora/auto.js?v=2.0.8"></script>
  <link rel="stylesheet" href="/blora/blora.css?v=2.0.8">
  <link rel="stylesheet" href="/blora/tokens.dark.css?v=2.0.8">
  <script src="/js/blora-foundation.js?v=2.0.8"></script>
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth-shell.css?v=4">
  <link rel="stylesheet" href="/css/edition-badge.css?v=1">
  <script>
    // Prevent FOUC - apply theme immediately
    (function() {
      var theme = localStorage.getItem('theme') || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(resolved);
    })();
  </script>
  <script>
    // 检查是否需要 OOBE，然后检查登录状态
    (async function() {
      try {
        // 先检查是否需要初始化（仅创建管理员一步）
        const setupRes = await fetch('/api/setup/status');
        if (setupRes.ok) {
          const setupData = await setupRes.json();
          if (setupData.needsSetup) {
            window.location.replace('/setup');
            return;
          }
        } else if (setupRes.status === 503) {
          // 数据库尚未就绪时也进入 setup 页提示用户等待
          window.location.replace('/setup');
          return;
        }
      } catch {}
      try {
        const res = await fetch('/auth/me', { credentials: 'same-origin' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.id) {
            window.location.replace('/console');
          }
        }
      } catch {}
    })();
  </script>
</head>
<body class="blora-page">
  <main class="auth-page login-container">
    <section class="blora-card auth-card login-card" aria-labelledby="auth-title">
      <header class="auth-card__header">
        <span class="auth-card__logo" aria-hidden="true"><img src="https://img.bloret.net/img/1778334791692/7cf47c179900187457dc3abba0eaf918" alt=""></span>
        <h1 id="auth-title">CrewRouter <span class="brand-edition-badge" data-edition-badge hidden></span></h1>
        <p>统一 AI 模型接入平台</p>
      </header>

      <div id="errorMessage" class="blora-message auth-error" data-variant="danger" role="alert"></div>

      <form id="loginForm" method="post" action="/auth/login?format=html" accept-charset="UTF-8" onsubmit="if (typeof handleLogin === 'function' && typeof window.fetch === 'function') { handleLogin(event); return false; } return true;">
        <blora-field id="loginInput" label="用户名或邮箱" name="login" type="text" autocomplete="username" placeholder="请输入用户名或邮箱" required></blora-field>
        <blora-field id="password" label="密码" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" minlength="6" required></blora-field>
        <div class="auth-actions">
          <button class="blora-button login-btn" data-variant="primary" type="submit" id="submitBtn"><span id="submitText">登录</span></button>
          <div id="passkeyLoginSection" class="login-alt-actions" style="display: none;"><button class="blora-button" data-variant="outline" data-block type="button" id="passkeyLoginBtn"><span id="passkeyLoginText">使用通行密钥登录</span></button></div>
        </div>
      </form>

      <form id="twoFactorForm" class="auth-2fa-form" style="display: none;" onsubmit="handle2FAVerify(event)">
        <blora-field id="tfaCode" label="请输入验证码" type="text" placeholder="6位验证码" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required></blora-field>
        <div class="auth-actions"><button type="submit" class="blora-button" data-variant="primary" data-block id="tfaSubmitBtn">验证</button><button type="button" class="blora-button" data-variant="outline" onclick="cancel2FA()">取消</button></div>
      </form>

      <div class="blora-divider" data-variant="text">或使用其他方式</div>
      <div class="auth-oauth">
        <div id="passportLoginSection" class="login-oauth-item" style="display: none;"><a href="/auth/passport" id="passportLoginLink" class="blora-button" data-variant="outline">Bloret PassPort 登录</a></div>
        <div id="feishuLoginSection" class="login-oauth-item" style="display: block;"><a href="/auth/feishu" class="blora-button" data-variant="outline"><span>飞书登录</span></a></div>
      </div>
      <p class="auth-simple-link"><a href="/plain-login">使用简洁登录页</a></p>

      <footer class="auth-card__footer">
        <blora-dropdown id="langToggle" class="auth-lang" label="中文" align="center" aria-label="选择语言"><blora-dropdown-item value="zh" href="/?lang=zh">中文</blora-dropdown-item><blora-dropdown-item value="en" href="/?lang=en">EN</blora-dropdown-item></blora-dropdown>
        <button id="themeToggle" class="blora-button" data-variant="ghost" data-size="sm" type="button" title="切换主题" data-i18n-title="切换主题" aria-label="切换主题"><img class="icon-sun sf-icon" src="https://img.bloret.net/SF/sun.max?color=white" alt="" width="18" height="18" data-sf-name="sun.max"><img class="icon-moon sf-icon" src="https://img.bloret.net/SF/moon?color=white" alt="" width="18" height="18" data-sf-name="moon" style="display:none"><img class="icon-system sf-icon" src="https://img.bloret.net/SF/desktopcomputer?color=white" alt="" width="18" height="18" data-sf-name="desktopcomputer" style="display:none"></button>
      </footer>
    </section>
  </main>

  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/edition-badge.js?v=1"></script>
  <script>
    (function () {
      const invite = new URLSearchParams(window.location.search).get('invite');
      if (invite && /^[A-Za-z0-9_-]{20,200}$/.test(invite)) {
        sessionStorage.setItem('passportInvite', invite);
        window.history.replaceState({}, document.title, window.location.pathname + window.location.hash);
      }
    })();
    (async function () {
      try {
        const r = await fetch('/auth/status');
        const d = await r.json();
        const feishu = document.getElementById('feishuLoginSection');
        const passport = document.getElementById('passportLoginSection');
        if (d.authMode === 'passport') { if (passport) passport.style.display = 'block'; if (feishu) feishu.style.display = 'none'; }
        else if (d.feishuEnabled && feishu) feishu.style.display = 'block';
        const link = document.getElementById('passportLoginLink');
        const storedInvite = sessionStorage.getItem('passportInvite');
        if (link && storedInvite) link.href = `/auth/passport?invite=${encodeURIComponent(storedInvite)}`;
      } catch (_) {}
    })();
  </script>
  <script>
    let pending2FAUserId = null;

    async function handleLogin(e) {
      e.preventDefault();
      const loginInput = document.querySelector('#loginInput input')?.value || '';
      const password = document.querySelector('#password input')?.value || '';
      const submitBtn = document.getElementById('submitBtn');
      const submitTextEl = document.getElementById('submitText');
      const errorEl = document.getElementById('errorMessage');

      submitBtn.disabled = true;
      if (submitTextEl) submitTextEl.innerHTML = `<span class="auth-inline-loading"><span class="blora-spinner" data-size="sm" role="status" aria-label="加载中"></span><span>处理中...</span></span>`;
      errorEl.classList.remove('show');

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ login: loginInput, password })
        });

        const data = await res.json();

        if (res.ok) {
          if (data.require2FA) {
            pending2FAUserId = data.userId;
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('twoFactorForm').style.display = 'block';
            document.getElementById('tfaCode')?.focus();
            return;
          }
          window.location.href = '/console';
          return;
        } else {
          errorEl.textContent = data.error || '登录失败';
          errorEl.classList.add('show');
        }
      } catch (err) {
        errorEl.textContent = '网络错误，请稍后重试';
        errorEl.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        if (submitTextEl) submitTextEl.textContent = '登录';
      }
    }

    async function handle2FAVerify(e) {
      e.preventDefault();
      const code = document.querySelector('#tfaCode input')?.value || '';
      const submitBtn = document.getElementById('tfaSubmitBtn');
      const errorEl = document.getElementById('errorMessage');
      
      submitBtn.disabled = true;
      errorEl.classList.remove('show');
      
      try {
        const res = await fetch('/auth/login/2fa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ userId: pending2FAUserId, code })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          window.location.href = '/console';
          return;
        } else {
          errorEl.textContent = data.error || '验证失败';
          errorEl.classList.add('show');
        }
      } catch (err) {
        errorEl.textContent = '网络错误，请稍后重试';
        errorEl.classList.add('show');
      } finally {
        submitBtn.disabled = false;
      }
    }

    function cancel2FA() {
      pending2FAUserId = null;
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('twoFactorForm').style.display = 'none';
      const tfaField = document.querySelector('#tfaCode input');
      if (tfaField) tfaField.value = '';
      document.getElementById('errorMessage').classList.remove('show');
    }

    // ========== PassKey 登录 ==========
    function base64urlToBuffer(base64url) {
      if (!base64url) return new ArrayBuffer(0);
      let base64 = String(base64url).replace(/-/g, '+').replace(/_/g, '/');
      const pad = base64.length % 4;
      if (pad) base64 += '='.repeat(4 - pad);
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    function bufferToBase64url(buffer) {
      if (!buffer) return '';
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    function preparePublicKeyOptions(options) {
      const result = { ...options };
      if (result.challenge && typeof result.challenge === 'string') {
        result.challenge = base64urlToBuffer(result.challenge);
      }
      if (result.allowCredentials && Array.isArray(result.allowCredentials)) {
        result.allowCredentials = result.allowCredentials.map(cred => ({
          ...cred,
          id: typeof cred.id === 'string' ? base64urlToBuffer(cred.id) : cred.id,
        }));
      }
      return result;
    }

    function prepareAuthenticationResponse(credential) {
      const rawId = bufferToBase64url(credential.rawId);
      const clientExtensionResults =
        typeof credential.getClientExtensionResults === 'function'
          ? credential.getClientExtensionResults()
          : {};
      const response = {
        clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
        authenticatorData: bufferToBase64url(credential.response.authenticatorData),
        signature: bufferToBase64url(credential.response.signature),
      };
      if (credential.response.userHandle) {
        response.userHandle = bufferToBase64url(credential.response.userHandle);
      }
      return {
        id: rawId,
        rawId,
        type: credential.type,
        authenticatorAttachment: credential.authenticatorAttachment || undefined,
        clientExtensionResults,
        response,
      };
    }

    async function handlePasskeyLogin() {
      const errorEl = document.getElementById('errorMessage');
      const btn = document.getElementById('passkeyLoginBtn');
      const textEl = document.getElementById('passkeyLoginText');
      const loginInput = document.querySelector('#loginInput input');

      errorEl.classList.remove('show');
      btn.disabled = true;
      if (textEl) textEl.innerHTML = `<span class="auth-inline-loading"><span class="blora-spinner" data-size="sm" role="status" aria-label="加载中"></span><span>验证中…</span></span>`;

      try {
        const username = (loginInput && loginInput.value || '').trim();
        const optRes = await fetch('/api/passkey/login/options', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(username ? { username } : {}),
        });
        const options = await optRes.json();
        if (!optRes.ok) {
          throw new Error(options.error || '获取通行密钥选项失败');
        }

        // 保存 challenge 字符串供服务端校验
        const challenge = options.challenge;
        const publicKey = preparePublicKeyOptions(options);

        const credential = await navigator.credentials.get({ publicKey });
        if (!credential) {
          throw new Error('用户取消了通行密钥验证');
        }

        const authBody = prepareAuthenticationResponse(credential);
        const verifyRes = await fetch('/api/passkey/login/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: username || undefined,
            body: authBody,
            challenge,
          }),
        });
        const data = await verifyRes.json();
        if (!verifyRes.ok || !data.success) {
          throw new Error(data.error || '通行密钥登录失败');
        }
        window.location.href = '/console';
      } catch (err) {
        console.error('PassKey 登录失败:', err);
        const msg = err.name === 'NotAllowedError'
          ? '操作已取消或超时'
          : (err.message || '通行密钥登录失败');
        errorEl.textContent = msg;
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
        if (textEl) textEl.textContent = '使用通行密钥登录';
      }
    }

    // 支持 WebAuthn 时显示 PassKey 登录
    (function initPasskeyLogin() {
      const section = document.getElementById('passkeyLoginSection');
      const btn = document.getElementById('passkeyLoginBtn');
      if (!section || !btn) return;
      if (window.PublicKeyCredential) {
        section.style.display = '';
        btn.addEventListener('click', handlePasskeyLogin);
      }
    })();

    // 检查飞书登录是否可用
    (async function checkFeishuLogin() {
      const section = document.getElementById('feishuLoginSection');
      if (!section) return;
      try {
        console.log('[登录页] 正在查询飞书登录状态…');
        const res = await fetch('/auth/feishu/status', { credentials: 'same-origin' });
        if (!res.ok) {
          console.warn('[登录页] 飞书状态接口异常, status=', res.status);
          return;
        }
        const data = await res.json();
        console.log('[登录页] 飞书登录状态:', data);
        if (data && data.enabled) {
          section.style.display = '';
          console.log('[登录页] 已显示飞书登录按钮');
        } else {
          section.style.display = 'none';
          console.log('[登录页] 飞书登录未启用，隐藏按钮');
        }
      } catch (err) {
        console.error('[登录页] 查询飞书状态失败:', err);
      }
    })();

    // 显示错误信息
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const success = params.get('success');
    if (error) {
      const errorEl = document.getElementById('errorMessage');
      const errors = {
        'session_failed': '会话保存失败',
        'login_failed': '用户名/密码错误或登录失败',
        'feishu_state_invalid': '飞书登录失败：安全校验不通过，请重试',
        'feishu_no_code': '飞书登录失败：未收到授权码',
        'feishu_token_failed': '飞书登录失败：获取 Token 失败',
        'feishu_userinfo_failed': '飞书登录失败：获取用户信息失败',
        'feishu_not_enterprise': '飞书登录失败：非企业用户，请使用企业飞书账号登录',
        'feishu_invalid_domain': '飞书登录失败：邮箱域名不在白名单内',
        'feishu_error': '飞书登录失败，请稍后重试'
      };
      errorEl.textContent = errors[error] || '登录失败：未知错误';
      errorEl.classList.add('show');
      window.history.replaceState({}, document.title, '/');
    }
    if (success) {
      const errorEl = document.getElementById('errorMessage');
      const successes = {
        'github_bound': 'GitHub 账号绑定成功'
      };
      if (successes[success]) {
        errorEl.textContent = successes[success];
        errorEl.setAttribute('data-variant', 'success');
        errorEl.classList.add('show');
      }
      window.history.replaceState({}, document.title, '/');
    }
  </script>
<script>
  // Page-level i18n: apply catalog to static DOM once ready.
  (function () {
    function apply() { if (window.I18N) I18N.applyDom(); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', apply);
    } else { apply(); }
    document.addEventListener('i18n:ready', apply);
    var el = document.getElementById('langToggle');
    if (el && window.I18N) {
      el.value = I18N.current();
      el.addEventListener('change', function () { I18N.load(el.value); });
    }
  })();
</script>
</body>
</html>
