name: SDK CI

on:
  push:
    paths:
      - 'sdk/**'
      - 'server/routes/**'
      - 'server/routes/mount-loader.js'
      - 'server/index.js'
      - 'server/scripts/**'
      - 'server/models/database.js'
      - 'server/runtime.js'
      - 'server/key-refresher.js'
      - 'server/plugins/**'
      - 'server/utils/**'
      - 'server/constants/**'
      - 'server/sdk/**'
      - 'server/middleware/request-auth.js'
      - 'server/utils/api-key-permissions.js'
      - 'public/js/api-key-permissions.json'
      - 'docs/sdk/**'
      - 'docs/API.md'
      - 'docs/api/**'
      - 'docs/integration-guide.md'
      - 'scripts/check-doc-links.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sdk-ci.yml'
      - 'cli/**'
      - 'CrewRouter-Desktop/package.json'
      - 'CrewRouter-Desktop/package-lock.json'
  pull_request:
    paths:
      - 'sdk/**'
      - 'server/routes/**'
      - 'server/routes/mount-loader.js'
      - 'server/index.js'
      - 'server/scripts/**'
      - 'server/models/database.js'
      - 'server/runtime.js'
      - 'server/key-refresher.js'
      - 'server/plugins/**'
      - 'server/utils/**'
      - 'server/constants/**'
      - 'server/sdk/**'
      - 'server/middleware/request-auth.js'
      - 'server/utils/api-key-permissions.js'
      - 'public/js/api-key-permissions.json'
      - 'docs/sdk/**'
      - 'docs/API.md'
      - 'docs/api/**'
      - 'docs/integration-guide.md'
      - 'scripts/check-doc-links.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sdk-ci.yml'
      - 'cli/**'
      - 'CrewRouter-Desktop/package.json'
      - 'CrewRouter-Desktop/package-lock.json'

jobs:
  contract:
    name: Contract and embedded SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sdk:check
      - run: npm run sdk:conformance
      - run: npm --prefix sdk/typescript run build
      - run: node server/scripts/test-sdk-auth-integration.js
      - run: node server/scripts/test-upstream-generation-routes.js
      - run: node server/scripts/test-console-route-auth-coverage.js
      - run: npm run test:embedded-sdk
      - run: npm run docs:check

  embedded-support-matrix:
    name: Embedded server compatibility (Node ${{ matrix.node-version }}, PostgreSQL ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
        postgres-version: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crewrouter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crewrouter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: node server/scripts/test-embedded-sdk-postgres.js
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: crewrouter_test
          PGUSER: postgres
          PGPASSWORD: postgres

  node-sdk:
    name: Node/TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --prefix sdk/typescript
      - run: npm --prefix sdk/typescript test
      - run: npm run sdk:conformance
      - working-directory: sdk/typescript
        run: npm pack --dry-run

  python-sdk:
    name: Python SDK (minimum and current)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build --wheel --sdist sdk/python
      - run: python -m pip install --no-deps sdk/python/dist/*.whl
      - run: python -m pip install "httpx>=0.27"
      - run: python -c "import crewrouter; from crewrouter import ChatCompletionRequest, AnthropicMessagesRequest, OpenAIResponsesRequest, ApiKeyListItem, DailyUsageItem, UserBalance; print(crewrouter.__file__); print('SDK wheel import OK')"
      - run: python -m pip install "sdk/python[test]"
      - run: python -m pytest sdk/python

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - working-directory: sdk/go
        run: go test ./...
      - working-directory: sdk/go
        run: go vet ./...
      - working-directory: sdk/go/consumer
        run: go test ./...
