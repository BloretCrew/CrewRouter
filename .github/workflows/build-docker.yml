name: Build & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_IMAGE_NAME: detritalw/crewrouter

jobs:
  # ============================================
  # Job 1: 构建直接运行交付包 (tar.gz)
  # ============================================
  build-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build release
        run: node deploy/build/build-release.js release

      - name: Assemble delivery package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG_DIR="crewrouter-direct"
          mkdir -p "$PKG_DIR"

          cp -r dist/ "$PKG_DIR/dist"
          cp start.sh "$PKG_DIR/"
          chmod +x "$PKG_DIR/start.sh"
          mkdir -p "$PKG_DIR/docs"
          cp docs/deployment.md "$PKG_DIR/docs/"
          cp LICENSE "$PKG_DIR/"

          tar czf "crewrouter-direct-v${VERSION}.tar.gz" "$PKG_DIR"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: crewrouter-direct
          path: crewrouter-direct-v*.tar.gz
          retention-days: 90

  # ============================================
  # Job 2: 构建 Docker 镜像
  # ============================================
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - dockerfile: deploy/docker/Dockerfile
            image_suffix: ""
            image_tag: latest
          - dockerfile: deploy/docker/Dockerfile.saas
            image_suffix: "-saas"
            image_tag: saas-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
            ${{ env.DOCKER_IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.image_tag }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Job 3: 创建 GitHub Release
  # ============================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-dist, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: crewrouter-direct

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: crewrouter-direct-v*.tar.gz
