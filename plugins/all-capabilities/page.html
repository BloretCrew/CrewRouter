<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全能力示例 - CrewRouter 插件</title>
  <link rel="stylesheet" href="/css/layers.css?v=2.1.0">
  <link rel="stylesheet" href="/blora/blora.css?v=2.1.0">
  <link rel="stylesheet" href="/blora/tokens.dark.css?v=2.1.0">
  <script type="module" src="/blora/auto.js?v=2.1.0"></script>
  <style>
    .plugin-page { padding: var(--blora-space-6); }
    .plugin-output { overflow: auto; max-height: 26rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body class="blora-page blora-scope">
  <main class="blora-container blora-stack plugin-page">
  <h1 class="blora-h2"><span data-icon="puzzle" aria-hidden="true"></span> 全能力示例（all-capabilities）</h1>
  <div class="blora-text-muted">演示插件系统全部 20 项权限与全部钩子。后端能力验证结果见服务日志。</div>

  <div class="blora-row" id="badges"></div>

  <div class="blora-card blora-stack" data-size="sm">
    <button type="button" class="blora-button" data-variant="primary" id="loadUsage">GET /usage</button>
    <pre class="blora-code plugin-output" id="usageOut">（点击按钮拉取 /api/plugins/all-capabilities/usage）</pre>
  </div>

  </main>
  <script>
    (function () {
      var caps = [
        'storage', 'network', 'gateway:modify', 'billing:modify', 'apikey:modify',
        'provider:register', 'stats:record', 'pages:register', 'slots:register',
        'routes:register', 'cron:register', 'themes:register', 'usage:read',
        'models:read', 'preferences:read', 'audit:write', 'export:usage',
        'meta:read', 'webhook:register', 'admin:view'
      ];
      document.getElementById('badges').innerHTML = caps.map(function (c) {
        return '<span class="blora-tag" data-variant="primary">' + c + '</span>';
      }).join('');

      document.getElementById('loadUsage').addEventListener('click', async function () {
        var out = document.getElementById('usageOut');
        out.textContent = '加载中...';
        try {
          var r = await fetch('/api/plugins/all-capabilities/usage', { credentials: 'same-origin' });
          var data = await r.json();
          out.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
          out.textContent = '请求失败: ' + e.message;
        }
      });
    })();
  </script>
</body>
</html>
